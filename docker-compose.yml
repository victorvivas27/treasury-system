version: '3.8'

services:
  backend:
    container_name: tesoreria-backend
    build:
      context: ./backend
    image: tesoreria-backend:1.0.0
    ports:
      - "5055:5055"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-tesoreria_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_PROFILE: ${APP_PROFILE:-dev}
      PORT: ${PORT:-5055}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      GMAIL_USER: ${GMAIL_USER:?GMAIL_USER is required}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?GMAIL_APP_PASSWORD is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GCS_ENABLED: ${GCS_ENABLED:-false}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_MAX_FILE_SIZE_MB: ${GCS_MAX_FILE_SIZE_MB:-10}
    depends_on:
      - postgres
    networks:
      - tesoreria_net
    restart: always

  postgres:
    container_name: tesoreria-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-tesoreria_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tesoreria_net
    restart: always



volumes:
  postgres_data:

networks:
  tesoreria_net:
    driver: bridge
