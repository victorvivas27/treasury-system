plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'pmd'
    id 'org.owasp.dependencycheck' version '12.2.2'
}

group = 'com.tesoreria'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // SPRING
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation platform('com.google.cloud:libraries-bom:26.72.0')
    implementation 'com.google.cloud:google-cloud-storage'

    // WEB PUSH
    implementation('nl.martijndwars:web-push:5.1.2') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bitbucket.b_c', module: 'jose4j'
    }
    implementation 'org.apache.httpcomponents:httpasyncclient:4.1.5'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // TOTP (2FA)
    implementation 'dev.samstevens.totp:totp:1.7.1'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // MAPSTRUCT
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // LOMBOK
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DEVTOOLS
    //developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // TEST (ÚNICO QUE SE USA)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // Permitir filtrado por tags desde la consola
    if (project.hasProperty("includeTags")) {
        useJUnitPlatform {
            includeTags project.getProperty("includeTags").split(',')
        }
    }

    if (project.hasProperty("excludeTags")) {
        useJUnitPlatform {
            excludeTags project.getProperty("excludeTags").split(',')
        }
    }
}

// ========== CONFIGURACIÓN JACOCO ==========
jacoco {
    toolVersion = "0.8.12"
}

def excludedClasses = [
        '**/TesoreriaAppApplication.class',
        '**/config/**',
        '**/dto/**',
        '**/exception/**',
        '**/constant/**',
        '**/entity/**',
        '**/mapper/**',
        '**/*Controller.*',
        '**/*Repository.*',
        '**/port/**',
        '**/adapter/**',
        '**/shared/**'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: excludedClasses)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: excludedClasses)
        }))
    }
}

// ========== CONFIGURACIÓN PMD ==========
pmd {
    toolVersion = '6.55.0'
    consoleOutput = true
    ignoreFailures = false
    ruleSets = []
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

tasks.withType(Pmd).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('pmdTest') {
    enabled = false
}

tasks.register('generateVapidKeys') {
    group = 'application'
    description = 'Genera un par de claves VAPID en formato base64url para Web Push.'
    doLast {
        def generator = java.security.KeyPairGenerator.getInstance('EC')
        generator.initialize(new java.security.spec.ECGenParameterSpec('secp256r1'))
        def pair = generator.generateKeyPair()
        def publicKey = (java.security.interfaces.ECPublicKey) pair.getPublic()
        def privateKey = (java.security.interfaces.ECPrivateKey) pair.getPrivate()
        def fixed32 = { java.math.BigInteger number ->
            byte[] raw = number.toByteArray()
            byte[] result = new byte[32]
            int sourceStart = Math.max(0, raw.length - 32)
            int length = Math.min(32, raw.length)
            System.arraycopy(raw, sourceStart, result, 32 - length, length)
            result
        }
        byte[] encodedPublic = new byte[65]
        encodedPublic[0] = 0x04
        System.arraycopy(fixed32(publicKey.getW().getAffineX()), 0, encodedPublic, 1, 32)
        System.arraycopy(fixed32(publicKey.getW().getAffineY()), 0, encodedPublic, 33, 32)
        def encoder = java.util.Base64.urlEncoder.withoutPadding()
        logger.lifecycle("WEB_PUSH_PUBLIC_KEY=${encoder.encodeToString(encodedPublic)}")
        logger.lifecycle("WEB_PUSH_PRIVATE_KEY=${encoder.encodeToString(fixed32(privateKey.getS()))}")
    }
}

// ========== CONFIGURACION OWASP DEPENDENCY-CHECK ==========
dependencyCheck {
    failBuildOnCVSS = 7.0
    formats = ['HTML', 'JSON']
    nvd.datafeedUrl = 'https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz'
    analyzers.assemblyEnabled = false
    analyzers.ossIndex.enabled = false
}

check.dependsOn jacocoTestCoverageVerification
