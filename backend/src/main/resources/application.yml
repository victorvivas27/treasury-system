spring:
  application:
    name: tesoreria-app
  flyway:
    enabled: false
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  profiles:
    active: ${APP_PROFILE:dev}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      max-file-size: ${GCS_MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${GCS_MAX_FILE_SIZE_MB:10}MB

server:
  port: ${PORT:5055}
  servlet:
    context-path: /tesoreria

app:
  time-zone: ${APP_TIME_ZONE:America/Santiago}
  treasury:
    managed-course: ${TREASURY_MANAGED_COURSE:1A}
  bootstrap:
    admin-key: ${ADMIN_BOOTSTRAP_KEY:}
    allow-local-without-key: false
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  email:
    provider: ${EMAIL_PROVIDER:gmail}
    from: ${EMAIL_FROM:}
  storage:
    gcs:
      enabled: ${GCS_ENABLED:false}
      bucket-name: ${GCS_BUCKET_NAME:}
      max-file-size-mb: ${GCS_MAX_FILE_SIZE_MB:10}
  web-push:
    enabled: ${WEB_PUSH_ENABLED:false}
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:tesoreria@example.com}
