spring:
  application:
    name: tesoreria-app
  profiles:
      active: ${APP_PROFILE:dev}

server:
      port: 5056
      servlet:
        context-path: /tesoreria

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
