info:
  name: 05-Update Non Existing Familia
  type: http
  seq: 5

http:
  method: PUT
  url: "{{Url_Base}}/familias/999999"
  body:
    type: json
    data: |-
      {
        "alumnoId": {{familiaAlumnoId}},
        "apoderados": [
          {
            "apoderadoId": {{familiaApoderadoId}},
            "parentesco": "Tutor",
            "esPrincipal": false
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status should be 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
