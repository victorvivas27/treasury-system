info:
  name: 03-Create Vinculo
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url_Base}}/alumnos/{{familiaAlumnoId}}/apoderados"
  body:
    type: json
    data: |-
      {
        "apoderadoId": {{familiaApoderadoId}},
        "parentesco": "Madre",
        "principal": true,
        "observaciones": "Apoderado principal"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response should contain alumnoId and apoderadoId", function () {
          expect(body.alumnoId).to.equal(Number(bru.getEnvVar("familiaAlumnoId")));
          expect(body.apoderadoId).to.equal(Number(bru.getEnvVar("familiaApoderadoId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
