info:
  name: 04-List Vinculos
  type: http
  seq: 4

http:
  method: GET
  url: "{{Url_Base}}/familias/alumno-apoderado?page=0&size=5"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response should include apoderado data and link fields", function () {
          expect(body.content.length).to.be.greaterThan(0);
          expect(body.content[0].alumnoCodigo).to.not.be.undefined;
          expect(body.content[0].apoderadoCodigo).to.not.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
