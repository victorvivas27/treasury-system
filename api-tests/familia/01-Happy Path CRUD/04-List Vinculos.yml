info:
  name: 04-List Vinculos
  type: http
  seq: 4

http:
  method: GET
  url: "{{Url_Base}}/alumnos/{{familiaAlumnoId}}/apoderados"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response should include apoderado data and link fields", function () {
          expect(body.length).to.be.greaterThan(0);
          expect(body[0].codigo).to.not.be.undefined;
          expect(body[0].parentesco).to.equal("Madre");
          expect(body[0].principal).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
