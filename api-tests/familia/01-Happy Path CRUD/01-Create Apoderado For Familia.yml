info:
  name: 01-Create Apoderado For Familia
  type: http
  seq: 1

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "MARIA FAMILIA",
        "email": "maria.familia{{$timestamp}}@gmail.com",
        "telefono": "987654321",
        "observaciones": "Apoderado para vínculo"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        bru.setEnvVar("familiaApoderadoId", body.id.toString(), { persist: true });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
