info:
  name: 06-Get Alumno With Apoderados
  type: http
  seq: 7

http:
  method: GET
  url: "{{Url_Base}}/alumnos/{{familiaAlumnoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Alumno detail should contain apoderados", function () {
          expect(body.apoderados).to.not.be.undefined;
          expect(body.apoderados.length).to.be.greaterThan(0);
          expect(body.apoderados[0].parentesco).to.equal("Tutor");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
