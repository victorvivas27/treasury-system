info:
  name: 04-List Familia
  type: http
  seq: 4

http:
  method: GET
  url: "{{Url_Base}}/familias?page=0&size=5"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response should be paginated", function () {
          expect(body.content).to.be.an("array");
          expect(body.page).to.equal(0);
          expect(body.size).to.equal(5);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
