info:
  name: 08-Get Alumno After Delete
  type: http
  seq: 9

http:
  method: GET
  url: "{{Url_Base}}/alumnos/{{familiaAlumnoCodigo}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Alumno should still exist after deleting link", function () {
          expect(body.alumnoId).to.equal(Number(bru.getEnvVar("familiaAlumnoId")));
          expect(body.codigo).to.equal(bru.getEnvVar("familiaAlumnoCodigo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
