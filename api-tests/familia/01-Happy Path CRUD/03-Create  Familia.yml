info:
  name: "03-Create  Familia "
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url_Base}}/familias/{{familiaAlumnoId}}"
  body:
    type: json
    data: |-
      {
        "apoderadosIds": [
          {{familiaApoderadoId}}
        ],
        "parentesco": "Tutor Legal",
        "principal": true,
        "observaciones": "El apoderado con ID 10 es el contacto de emergencia principal."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response should contain alumnoId and apoderadoId", function () {
          expect(body.alumnoId).to.equal(Number(bru.getEnvVar("familiaAlumnoId")));
          expect(body.apoderadoId).to.equal(Number(bru.getEnvVar("familiaApoderadoId")));
        });

        bru.setEnvVar("familiaVinculoId", body.id.toString(), { persist: true });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
