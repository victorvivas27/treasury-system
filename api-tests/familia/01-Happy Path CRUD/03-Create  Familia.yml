info:
  name: "03-Create  Familia "
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url_Base}}/familias/{{familiaAlumnoId}}"
  body:
    type: json
    data: |-
      {
        "apoderadosIds": [
          {{familiaApoderadoId}}
        ],
        "parentesco": "Tutor Legal",
        "principal": true,
        "observaciones": "El apoderado con ID 10 es el contacto de emergencia principal."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response should contain alumnoId and apoderadoId", function () {
          expect(body.alumnoId).to.equal(Number(bru.getEnvVar("familiaAlumnoId")));
          // Acceso al primer elemento del arreglo [0]
          expect(body.apoderadosIds[0]).to.equal(Number(bru.getEnvVar("familiaApoderadoId")));
        });

        // Guardar la variable de forma segura e independiente del formateo
        // if (body && body.familiaId) {
        //   // Bruno persiste las variables de entorno automáticamente en memoria durante la sesión
        //   bru.setEnvVar("familiaId", String(body.familiaId));
        // }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
