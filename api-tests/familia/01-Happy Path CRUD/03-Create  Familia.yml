info:
  name: "03-Create Familia"
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url_Base}}/familias"
  body:
    type: json
    data: |-
      {
        "alumnoId": {{familiaAlumnoId}},
        "observacionesGenerales": "El apoderado es el contacto de emergencia principal.",
        "apoderados": [
          {
            "apoderadoId": {{familiaApoderadoId}},
            "parentesco": "Tutor Legal",
            "esPrincipal": true
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response should contain familia and relations", function () {
          expect(body.alumnoId).to.equal(Number(bru.getEnvVar("familiaAlumnoId")));
          expect(body.apoderados[0].apoderadoId).to.equal(Number(bru.getEnvVar("familiaApoderadoId")));
          expect(body.apoderados[0].esPrincipal).to.equal(true);
        });

        if (body && body.familiaId) {
          bru.setEnvVar("familiaId", String(body.familiaId));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
