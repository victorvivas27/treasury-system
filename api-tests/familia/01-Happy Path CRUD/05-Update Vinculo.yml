info:
  name: 05-Update Vinculo
  type: http
  seq: 5

http:
  method: PUT
  url: "{{Url_Base}}/alumnos/{{familiaAlumnoId}}/apoderados/{{familiaApoderadoId}}"
  body:
    type: json
    data: |-
      {
        "parentesco": "Tutor",
        "principal": false,
        "observaciones": "Contacto secundario"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Vinculo should be updated", function () {
          expect(body.parentesco).to.equal("Tutor");
          expect(body.principal).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
