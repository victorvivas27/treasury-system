info:
  name: 04-Get Familia By ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{Url_Base}}/familias/{{familiaId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response should include student and apoderado display fields", function () {
          expect(body.familiaId).to.equal(Number(bru.getEnvVar("familiaId")));
          expect(body.codigoFamilia).to.not.be.undefined;
          expect(body.alumno.codigo).to.not.be.undefined;
          expect(body.apoderados[0].codigo).to.not.be.undefined;
          expect(body.apoderados[0].relacion.parentesco).to.equal("Tutor Legal");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
