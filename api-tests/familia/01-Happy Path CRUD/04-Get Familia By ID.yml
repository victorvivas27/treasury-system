info:
  name: 04-Get Familia By ID
  type: http
  seq: 5

http:
  method: GET
  url: "{{Url_Base}}/familias/by-id/2"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response should include student and apoderado display fields", function () {
          expect(body.id).to.equal(Number(bru.getEnvVar("familiaVinculoId")));
          expect(body.alumnoCodigo).to.not.be.undefined;
          expect(body.apoderadoCodigo).to.not.be.undefined;
          expect(body.parentesco).to.equal("Madre");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
