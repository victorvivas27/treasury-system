info:
  name: 09-Get Apoderado After Delete
  type: http
  seq: 10

http:
  method: GET
  url: "{{Url_Base}}/apoderados/{{familiaApoderadoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Apoderado should still exist after deleting link", function () {
          expect(body.id).to.equal(Number(bru.getEnvVar("familiaApoderadoId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
