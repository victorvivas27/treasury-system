info:
  name: 01 - List Empty List
  type: http
  seq: 1

http:
  method: GET
  url: "{{Url_Base}}/apoderados"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Pre Request
        const baseUrl = bru.getEnvVar('Url_Base');

        // Listar todos
        const listar = await bru.sendRequest({
          url: `${baseUrl}/apoderados`,
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        //console.log(listar)

        const apoderados = listar.data;

        // Eliminar uno por uno
        for (const ap of apoderados) {
          await bru.sendRequest({
            url: `${baseUrl}/apoderados/${ap.id}`,
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' }
          });
        }
    - type: tests
      code: |-
        const response = res.getBody();

        test("Listar apoderados cuando no hay debe retornar lista vacia", function() {
          expect(res.getStatus()).to.equal(200);
          expect(Array.isArray(response)).to.be.true;
          expect(response.length).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
