info:
  name: 06 - Nombre With Special Chars
  type: http
  seq: 6

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "Victor@",
        "email": "victor@example.com",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: nombre
  scripts:
