info:
  name: 03 - Email Local Part Too Short
  type: http
  seq: 3

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "Juan Perez",
        "email": "ju@gmail.com",
        "telefono": "123456789"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        // test("Error code should be AP-004", function() {
        //   expect(res.body.code).to.equal("AP-004");
        // });

        // test("Status should be 400", function() {
        //   expect(res.status).to.equal(400);
        // });

        // test("Should only report email invalid format", function() {
        //   expect(res.body.errors).to.not.have.property("nombre");
        //   expect(res.body.errors).to.have.property("email");
        //   expect(res.body.errors).to.not.have.property("telefono");
        // });

        //Debe rechazar los correos electrónicos con una parte local de menos de 3 caracteres.
        test("Should reject email with local part less than 3 characters", function() {
          expect(res.status).to.equal(400);
          expect(res.body.errors).to.have.property("email");
          expect(res.body.errors.email).to.equal("El nombre local del email debe tener al menos 3 caracteres");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
