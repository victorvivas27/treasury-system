info:
  name: 04 - Email Too Long
  type: http
  seq: 4

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "Juan Perez",
        "email": "juan.pa.perez.muy.largo.este.email.super.extenso.para.superar.cien.caracteres.seguro.que.si@example.com",
        "telefono": "123456789"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        // test("Error code should be ERROR_VALIDACION", function() {
        //   expect(res.body.code).to.equal("ERROR_VALIDACION");
        // });

        // test("Status should be 400", function() {
        //   expect(res.status).to.equal(400);
        // });

        // test("Should only report email invalid format", function() {
        //   expect(res.body.errors).to.not.have.property("nombre");
        //   expect(res.body.errors).to.have.property("email");
        //   expect(res.body.errors).to.not.have.property("telefono");
        // });

        //Debe rechazar los correos electrónicos con más de 100 caracteres.
        test("Should reject email with more than 100 characters", function() {
          expect(res.status).to.equal(400);
          expect(res.body.errors).to.have.property("email");
          expect(res.body.errors.email).to.equal("El email no puede tener más de 100 caracteres");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
