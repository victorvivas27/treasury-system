info:
  name: 01-Get Non Existing ID
  type: http
  seq: 1
  tags:
    - apoderados

http:
  method: GET
  url: "{{Url_Base}}/apoderados/{{codigo}}"
  body:
    type: json
    data: "{{bodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.codigo) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.codigo}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json' }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }
    - type: tests
      code: |-
        const response = res.getBody();
        const codigo = bru.getEnvVar('codigo');

        test("Get apoderado inexistente debe retornar 404", function() {
            expect(res.status).to.equal(404);
            expect(response.errors.id).to.equal(`Apoderado con codigo ${codigo} no encontrado`);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
