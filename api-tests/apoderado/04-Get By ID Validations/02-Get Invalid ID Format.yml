info:
  name: 02-Get Invalid ID Format
  type: http
  seq: 2

http:
  method: GET
  url: "{{Url_Base}}/apoderados/{{id_invalido}}"
  body:
    type: json
    data: "{{bodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("id_invalido", "abc");
    - type: tests
      code: |-
        const response = res.getBody();

        test("Get con ID invalido debe retornar 400", function() {
          expect(res.getStatus()).to.equal(400);
          expect(response.status).to.equal(400);
          expect(response.error).to.equal("Bad Request");
          expect(response.path).to.include("/apoderados/abc");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
