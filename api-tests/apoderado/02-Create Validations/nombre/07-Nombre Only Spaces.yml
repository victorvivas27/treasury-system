info:
  name: 07-Nombre Only Spaces
  type: http
  seq: 7

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "    ",
        "email": "maria@gmail.com",
        "telefono": "+7888888888"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: nombre
  scripts:
    - type: tests
      code: |-
        //El mensaje de error debe indicar que el nombre no puede estar vacío.
        test("Error message should indicate name cannot be empty", function() {
          expect(res.body.errors.nombre).to.match(/vacío|vacio|required|obligatorio/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
