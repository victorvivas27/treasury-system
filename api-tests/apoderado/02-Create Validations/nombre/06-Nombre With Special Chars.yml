info:
  name: 06-Nombre With Special Chars
  type: http
  seq: 6

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "Victor@",
        "email": "victor@example.com",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: nombre
  scripts:
    - type: tests
      code: |-
        //El mensaje de error debe indicar solo letras.
        test("Error message should indicate letters only", function() {
          expect(res.body.errors.nombre).to.match(/letras|espacios|tildes/i);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
