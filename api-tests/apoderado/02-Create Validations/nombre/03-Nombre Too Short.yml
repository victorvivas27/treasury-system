info:
  name: 03-Nombre Too Short
  type: http
  seq: 3
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "Vi",
        "email": "victor@example.com",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: nombre
  scripts:
    - type: tests
      code: |-
        //El mensaje de error debe indicar un mínimo de 3 caracteres.
        test("Error message should indicate minimum 3 characters", function() {
          expect(res.body.errors.nombre).to.match(/al menos 3 caracteres/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
