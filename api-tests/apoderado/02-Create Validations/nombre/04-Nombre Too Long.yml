info:
  name: "04-Nombre Too Long "
  type: http
  seq: 4

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "Victor Alejandro Jose Maria Rodriguez Fernandez Pepe",
        "email": "victor@example.com",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: nombre
  scripts:
    - type: tests
      code: |-
        //El mensaje de error debe indicar un máximo de 50 caracteres.
        test("Error message should indicate maximum 50 characters", function() {
          expect(res.body.errors.nombre).to.match(/no puede tener más de 50 caracteres/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
