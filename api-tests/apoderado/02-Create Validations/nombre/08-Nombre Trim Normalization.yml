info:
  name: 08-Nombre Trim Normalization
  type: http
  seq: 8
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "   Juan Perez   ",
        "email": "juan@gmail.com",
        "telefono": "+56912345678"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        //El nombre debe estar escrito en mayúsculas.
        test("The name must be in all capital letters.", function() {
          expect(res.body.nombre).to.equal("JUAN PEREZ");
        });
        //Variable de environment intentando persistir en disco
        bru.setEnvVar("apoderadoId", body.apoderadoId.toString(), { persist: true });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
