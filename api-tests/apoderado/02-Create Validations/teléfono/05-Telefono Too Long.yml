info:
  name: 05-Telefono Too Long
  type: http
  seq: 5

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre":"Victor Javier",
        "email":"victor@gmail.com",
        "telefono":"+123456789101213"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: telefono
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los telefonos con mas de 15 digitos.
        test("Should reject telefono with more than 15 digits", function() {
          expect(res.body.errors.telefono).to.equal("El teléfono no puede tener más de 15 dígitos");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
