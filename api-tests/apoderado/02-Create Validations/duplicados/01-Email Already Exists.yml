info:
  name: 01-Email Already Exists
  type: http
  seq: 1
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre":"Victor Vivas",
        "email":"victor@gmail.com",
        "telefono":"+987654321"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.codigo) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.codigo}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }


        const apoderado = {
          nombre: "Victor Vivas",
          email: "victor@gmail.com",
          telefono: "+987654321"
        };

        const preResponse = await bru.sendRequest({
          url: `${baseUrl}/apoderados`,
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${bru.getEnvVar('adminToken')}`
          },
          data: apoderado
        });
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');
        const codigo = bru.getVar('apoderadoIdCreadoPre');

        if (codigo) {
          try {
            await bru.sendRequest({
              url: `${baseUrl}/apoderados/${codigo}`,
              method: 'DELETE',
              headers: { Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
            });

            console.log(`✅ Apoderado ${codigo} eliminado`);
          } catch(error) {
            //console.log(`❌ Error eliminando: ${error}`);
          }
        } else {
          //console.log('⚠️ No se encontró ID para eliminar');
        }
    - type: tests
      code: |-
        // 2. Test del request principal (el que debe fallar por duplicado)
        const response = res.getBody();

        test("Email duplicado debe fallar", function() {
          expect(res.getStatus()).to.equal(409);
          expect(response.errors.email).to.equal("El email victor@gmail.com ya está registrado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
