info:
  name: 01-Email Already Exists
  type: http
  seq: 1

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre":"Victor Vivas",
        "email":"victor@gmail.com",
        "telefono":"+987654321"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        const apoderado = {
          nombre: "Victor Vivas",
          email: "victor@gmail.com",
          telefono: "+987654321"
        };

        const preResponse = await bru.sendRequest({
          url: `${baseUrl}/apoderados`,
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          data: apoderado
        });

        const creadoRaw = preResponse.data || preResponse.body;

        const creado = typeof creadoRaw === "string"
          ? JSON.parse(creadoRaw)
          : creadoRaw;

        //console.log("Respuesta Pre:", creado);

        bru.setVar("apoderadoIdCreadoPre", creado.id);
        bru.setVar("bodyData", JSON.stringify(apoderado));

        //console.log(`✅ Apoderado creado en Pre Request: ${creado.id}`);
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');
        const id = bru.getVar('apoderadoIdCreadoPre');

        if (id) {
          try {
            await bru.sendRequest({
              url: `${baseUrl}/apoderados/${id}`,
              method: 'DELETE'
            });

            console.log(`✅ Apoderado ${id} eliminado`);
          } catch(error) {
            console.log(`❌ Error eliminando: ${error}`);
          }
        } else {
          console.log('⚠️ No se encontró ID para eliminar');
        }
    - type: tests
      code: |-
        // 2. Test del request principal (el que debe fallar por duplicado)
        const response = res.getBody();

        test("Email duplicado debe fallar", function() {
          expect(res.getStatus()).to.equal(409);
          expect(response.errors.email).to.equal("El email victor@gmail.com ya está registrado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
