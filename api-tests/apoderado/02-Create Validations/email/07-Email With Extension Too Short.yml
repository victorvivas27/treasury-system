info:
  name: 07-Email With Extension Too Short
  type: http
  seq: 7
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email":"juan@gmail.c",
        "nombre":"Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los correos electrónicos con extensiones de menos de 2 caracteres.
        test("Should reject email with extension less than 2 characters", function() {
         expect(res.body.errors.email).to.equal("La extensión del email debe tener al menos 2 caracteres");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
