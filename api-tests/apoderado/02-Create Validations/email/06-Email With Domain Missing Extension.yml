info:
  name: 06-Email With Domain Missing Extension
  type: http
  seq: 6

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email":"juan@gmail",
        "nombre":"Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los correos electrónicos con dominios a los que les falte el punto y la extensión.
        test("Should reject email with domain missing dot and extension", function() {
          expect(res.body.errors.email).to.equal("El email debe tener un dominio con extensión válida (.com, .ar, .es, etc.)");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
