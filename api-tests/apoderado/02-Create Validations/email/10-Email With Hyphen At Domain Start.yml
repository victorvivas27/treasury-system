info:
  name: 10-Email With Hyphen At Domain Start
  type: http
  seq: 10

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email": "juan@-gmail.com",
        "nombre": "Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        // test("Error code should be AP-004", function() {
