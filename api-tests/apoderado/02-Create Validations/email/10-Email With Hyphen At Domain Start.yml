info:
  name: 10-Email With Hyphen At Domain Start
  type: http
  seq: 10

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email": "juan@-gmail.com",
        "nombre": "Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los correos electrónicos con guion inmediatamente después de @.
        test("Should reject email with hyphen immediately after @", function() {
          expect(res.body.errors.email).to.equal("Formato de email inválido. Ejemplo válido: usuario@dominio.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
