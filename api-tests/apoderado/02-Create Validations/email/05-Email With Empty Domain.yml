info:
  name: 05-Email With Empty Domain
  type: http
  seq: 5

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email":"juan@",
        "nombre":"Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

