info:
  name: 05-Email With Empty Domain
  type: http
  seq: 5
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email":"juan@",
        "nombre":"Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los correos electrónicos sin nombre de usuario y dominio válidos.
        test("Should reject email without valid username and domain", function() {
          expect(res.body.errors.email).to.equal("El email debe tener un usuario y un dominio válidos Ejemplo válido: usuario@dominio.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
