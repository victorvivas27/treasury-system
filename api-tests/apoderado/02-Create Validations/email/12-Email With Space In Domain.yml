info:
  name: 12-Email With Space In Domain
  type: http
  seq: 12

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email": "juan@ gmail.com",
        "nombre": "Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los correos electrónicos que contengan espacios en blanco después de la @.
        test("You must reject emails containing whitespace after the @", function() {
          expect(res.body.errors.email).to.equal("Formato de email inválido. Ejemplo válido: usuario@dominio.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
