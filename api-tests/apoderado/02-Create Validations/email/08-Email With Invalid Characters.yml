info:
  name: 08-Email With Invalid Characters
  type: http
  seq: 8
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email":"juan*@gmail.com",
        "nombre":"Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los correos electrónicos con caracteres no válidos.
        test("Should reject email with invalid characters", function() {
          expect(res.body.errors.email).to.equal("Formato de email inválido. Ejemplo válido: usuario@dominio.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
