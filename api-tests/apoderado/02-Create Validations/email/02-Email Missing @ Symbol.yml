info:
  name: 02-Email Missing @ Symbol
  type: http
  seq: 2

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "Juan Perez",
        "email": "juanperezoemail.com",
        "telefono": "123456789"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        // test("Error code should be AP-004", function() {
        //   expect(res.body.code).to.equal("AP-004");
        // });

        // test("Status should be 400", function() {
        //   expect(res.status).to.equal(400);
        // });

        // test("Should only report email invalid format", function() {
        //   expect(res.body.errors).to.not.have.property("nombre");
        //   expect(res.body.errors).to.have.property("email");
        //   expect(res.body.errors).to.not.have.property("telefono");
        // });

        //Se deben rechazar los correos electrónicos que no contengan el símbolo @.
        test("Should reject email without @ symbol", function() {
          expect(res.status).to.equal(400);
          expect(res.body.errors).to.have.property("email");
          expect(res.body.errors.email).to.equal("El email debe contener el símbolo @");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
