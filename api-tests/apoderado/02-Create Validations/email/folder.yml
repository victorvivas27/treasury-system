    - type: after-response
      code: |-
        // Leemos el texto de la variable (ej: "nombre,email,telefono")
        const rawFields = bru.getRequestVar("fields_present");

        if (rawFields) {
            // Convertimos el texto en una lista real de JS
            const fieldsPresent = rawFields.split(',');

            test("Status should be 400", () => {
                expect(res.status).to.equal(400);
            });

            test("Status should have ERROR_VALIDACION", () => {
                expect(res.body).to.not.have.property("code");
                // Para tu estructura, verificamos que exista el objeto errors
                expect(res.body).to.have.property("errors");
            });

            test("Field validation check", () => {
                fieldsPresent.forEach(f => {
                    // Trim elimina espacios accidentales
                    const fieldName = f.trim();
                    expect(res.body.errors).to.have.property(fieldName);
                    // Opcional: verificar que el mensaje de error no esté vacío
                    expect(res.body.errors[fieldName]).to.be.a('string').and.not.empty;
                });
            });
        }
