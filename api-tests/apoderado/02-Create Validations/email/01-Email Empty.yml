http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre":"Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //El mensaje de error para el correo electrónico debe ser correcto.
        test("Error message for email should be correct", function() {
          expect(res.body.errors.email).to.equal("El email no puede estar vacío");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
