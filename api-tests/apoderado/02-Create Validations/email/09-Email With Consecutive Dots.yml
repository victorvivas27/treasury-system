info:
  name: 09-Email With Consecutive Dots
  type: http
  seq: 9
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "email": "juan@hotmail..com",
        "nombre": "Victor Vivas",
        "telefono": "987654321"
      }
  auth: inherit

runtime:
  variables:
    - name: fields_present
      value: email
  scripts:
    - type: tests
      code: |-
        //Debe rechazar los correos electrónicos con puntos consecutivos en el dominio.
        test("Should reject email with consecutive dots in domain", function() {
          expect(res.body.errors.email).to.equal("Formato de email inválido. Ejemplo válido: usuario@dominio.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
