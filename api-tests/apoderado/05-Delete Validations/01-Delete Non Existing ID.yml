info:
  name: 01-Delete Non Existing ID
  type: http
  seq: 1
  tags:
    - apoderados

http:
  method: DELETE
  url: "{{Url_Base}}/apoderados/{{codigo}}"
  body:
    type: json
    data: "{{bodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const response = res.getBody();
        const codigo = bru.getEnvVar('codigo');

        test("Get apoderado inexistente debe retornar 404", function() {
          expect(response.status).to.equal(404);
            expect(response.errors.id).to.equal(`Apoderado con codigo ${codigo} no encontrado`);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
