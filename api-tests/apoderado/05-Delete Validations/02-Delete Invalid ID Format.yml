info:
  name: 02-Delete Invalid ID Format
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{Url_Base}}/apoderados/{{id_invalido}}"
  body:
    type: json
    data: "{{bodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const response = res.getBody();

        test("Get con codigo invalido debe retornar 400", function() {
            expect(response.status).to.equal(400);
            expect(response.errors.codigo).to.equal("Formato de código inválido. Debe ser AP-XXXXXXXX");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
