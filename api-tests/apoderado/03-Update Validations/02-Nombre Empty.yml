info:
  name: 02-Nombre Empty
  type: http
  seq: 2

http:
  method: PUT
  url: "{{Url_Base}}/apoderados/{{apoderadoIdCreadoPre}}"
  body:
    type: json
    data: |-
      {
        "email":"victor@gmail.com",
        "telefono":"+56783432",
        "nombre":""
        
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        //El estado debería ser 400
        test("Status should be 400", function() {
            expect(res.status).to.equal(400);
          });
          //El código de error debería ser ERROR_VALIDACION
          test("Error code should be ERROR_VALIDACION", function() {
            expect(res.body.code).to.equal("ERROR_VALIDACION");
          });
        //Debe enumerar los campos faltantes.
          test("Should list missing fields", function() {
            expect(res.body.errors).to.have.property("nombre");
            expect(res.body.errors).to.not.property("email");
            expect(res.body.errors).to.not.property("telefono");
          });

        test("Error message for nombre should be descriptive", function() {
          const mensaje = res.body.errors.nombre;
          const mensajesValidos = [
            "El nombre no puede estar vacío",
            "El nombre debe tener al menos 3 caracteres",
            "El nombre solo puede contener letras, espacios y tildes"
          ];
          expect(mensajesValidos).to.include(mensaje);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
