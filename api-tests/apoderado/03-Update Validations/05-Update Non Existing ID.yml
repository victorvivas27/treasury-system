info:
  name: 05-Update Non Existing ID
  type: http
  seq: 5

http:
  method: PUT
  url: "{{Url_Base}}/apoderados/{{apoderadoIdCreadoPre}}"
  body:
    type: json
    data: |-
      {
        "email": "victor@gmail.com",
        "telefono": "+56987654",
        "nombre": "Victor Javier"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.apoderadoId) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.apoderadoId}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json' }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.apoderadoId) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.apoderadoId}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json' }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }
    - type: tests
      code: |-
        const id = bru.getVar('apoderadoIdCreadoPre');
        //El estado debería ser 400
        test("Status should be 400", function() {
            expect(res.status).to.equal(404);
          });
          //El código de error debería ser ERROR_VALIDACION
          test("Error code should be AP-404", function() {
            expect(res.body.code).to.equal("AP-404");
          });
        //Debe enumerar los campos faltantes.
          test("Should list missing fields", function() {
              expect(res.body.errors).to.have.property("id");
            expect(res.body.errors).to.not.property("nombre");
            expect(res.body.errors).to.not.property("email");
            expect(res.body.errors).to.not.property("telefono");
          });
        //console.log("Campos:", bru.getRequestVar("fields_present")); 
        //Los mensajes de error deben ser descriptivos.
          test("Error messages should be descriptive", function() {
            expect(res.body.errors.id).to.equal(`Apoderado con apoderadoId ${id} no encontrado`);
          });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
