info:
  name: 05-Update Non Existing ID
  type: http
  seq: 5
  tags:
    - apoderados

http:
  method: PUT
  url: "{{Url_Base}}/apoderados/{{codigo}}"
  body:
    type: json
    data: |-
      {
        "email": "victor@gmail.com",
        "telefono": "+56987654",
        "nombre": "Victor Javier"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.codigo) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.codigo}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.apoderadoId) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.apoderadoId}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }
    - type: tests
      code: |-
        //El estado debería ser 404
        test("Status should be 404", function() {
            expect(res.status).to.equal(404);
        });

        //Verificar que NO tiene código de error
        test("Error code should NOT exist", function() {
            expect(res.body).to.not.have.property("code");
        });

        //Debe enumerar los campos faltantes
        const fieldsPresent = bru.getRequestVar("fields_present");
        const expectedFields = fieldsPresent ? fieldsPresent.split(',').map(f => f.trim()) : [];

        test("Should list missing fields", function() {
            expectedFields.forEach(field => {
                expect(res.body.errors).to.have.property(field);
            });
        });

        //Los mensajes de error deben ser descriptivos
        test("Error messages should be descriptive", function() {
            expectedFields.forEach(field => {
                expect(res.body.errors[field]).to.include("no encontrado");
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
