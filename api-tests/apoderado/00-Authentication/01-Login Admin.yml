info:
  name: 01-Login Admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{Url_Base}}/auth/login"
  body:
    type: json
    data: |-
      {
        "correo": "{{Admin_Email}}",
        "password": "{{Admin_Password}}"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        test("Autenticación administrativa aprobada", function () {
          expect(res.getStatus()).to.equal(200);
          expect(body.user.rol).to.equal("ADMIN");
        });
        test("Token administrativo almacenado", function () {
          expect(body.token).to.be.a("string").and.not.be.empty;
          bru.setEnvVar("adminToken", body.token);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
