info:
  name: 01-List Empty List
  type: http
  seq: 1
  tags:
    - apoderados

http:
  method: GET
  url: "{{Url_Base}}/apoderados"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.apoderadoId) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.apoderadoId}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json' }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }
    - type: tests
      code: |-
        const response = res.getBody();

        test("Listar apoderados cuando no hay debe retornar lista vacia", function() {
          expect(res.getStatus()).to.equal(200);
          expect(Array.isArray(response.content)).to.be.true;
          
          // CORRECCIÓN: Validar el tamaño del array 'content'
          expect(response.content.length).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
