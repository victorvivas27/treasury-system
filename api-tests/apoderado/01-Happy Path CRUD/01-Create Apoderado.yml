info:
  name: 01-Create Apoderado
  type: http
  seq: 1
  tags:
    - apoderados

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: "{{bodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseUrl = bru.getEnvVar('Url_Base');

        try {
          const listar = await bru.sendRequest({
            url: `${baseUrl}/apoderados?size=100`,
            method: 'GET',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
          });

          const apoderados = listar.data && listar.data.content ? listar.data.content : null;
          
          if (apoderados && apoderados.length > 0) {
            for (const ap of apoderados) {
              if (ap.codigo) {
                await bru.sendRequest({
                  url: `${baseUrl}/apoderados/${ap.codigo}`,
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${bru.getEnvVar('adminToken')}` }
                });
              }
            }
          }
        } catch (e) {
          // Silenciado
        }
    - type: tests
      code: |-
        // Response body guarda el body  de la respuesta 
        const body = res.getBody();
        if (body && body.apoderadoId) {
          bru.setEnvVar("apoderadoId", String(body.apoderadoId));
        }
         bru.setEnvVar("codigo",(body.codigo));

        //El estado debería  ser 201
        test("Status should be 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        //La respuesta debe contener el ID.
        test("Response should contain apoderadoId", function () {
        expect(body.apoderadoId).to.not.be.undefined;
        });

        test("Response should contain codigo", function () {
        expect(body.codigo).to.not.be.undefined;
        });

        //El nombre debe escribirse en mayúsculas.
        test("Name should be uppercase", function () {
         expect(body.nombre).to.equal("VICTOR JAVIER");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
