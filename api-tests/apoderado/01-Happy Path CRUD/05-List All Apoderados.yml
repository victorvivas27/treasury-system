info:
  name: 05-List All Apoderados
  type: http
  seq: 5
  tags:
    - apoderados

http:
  method: GET
  url: "{{Url_Base}}/apoderados"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        //El estado debe ser 200
        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("Validate paginated response and content structure", function () {
          // 1. Validar que la respuesta base sea un objeto y tenga la estructura de paginación
          expect(body).to.be.an('object');
          expect(body).to.have.all.keys('content', 'page', 'size', 'totalElements', 'totalPages');

          // 2. Validar que 'content' sea la matriz requerida y no esté vacía
          expect(body.content).to.be.an('array').and.to.have.lengthOf.at.least(1);

          // 3. Opcional: Validar que el primer elemento tenga la estructura de un 'apoderado'
          const primerApoderado = body.content[0];
          expect(primerApoderado).to.include.all.keys('apoderadoId', 'codigo', 'nombre', 'email');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
