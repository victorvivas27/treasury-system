info:
  name: 03-Update Apoderado By ID
  type: http
  seq: 3
  tags:
    - apoderados

http:
  method: PUT
  url: "{{Url_Base}}/apoderados/{{codigo}}"
  body:
    type: json
    data: "{{bodyDataUpdate}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        //El estado debe ser 200
        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        //La respuesta debe contener el ID.
        test("Response should contain apoderadoId", function () {
          //expect(body.id).to.equal(Number(bru.getVar("apoderadoId")));
          expect(body.apoderadoId).to.equal(Number(bru.getEnvVar("apoderadoId")));
        });

        test("Response should contain codigo", function () {
          expect(body.codigo).to.equal(bru.getEnvVar("codigo"));
        });
        //El nombre debe escribirse en mayúsculas.
        test("Name should be uppercase", function () {
         expect(body.nombre).to.equal("VICTOR JAVIER VIVAS");
        });

        //La dirección de correo electrónico debe escribirse en minúsculas.
        test("Email should be lowercase", function () {
        expect(body.email).to.equal("vivasvivas@gmail.com");
        });
        //Debería existir un teléfono.
        test("Telefono should exist", function () {
         expect(body.telefono).to.not.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
