info:
  name: 03-List Users
  type: http
  seq: 3

http:
  method: GET
  url: "{{Url_Base}}/users?page=0&size=10"
  headers:
    - name: Authorization
      value: "Bearer {{userToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("Response should be paginated", function () {
          expect(body.content).to.be.an("array");
          expect(body.totalElements).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
