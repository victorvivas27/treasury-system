info:
  name: 01-Delete Non Existing ID
  type: http
  seq: 1
  tags:
    - alumno

http:
  method: DELETE
  url: "{{Url_Base}}/alumnos/{{codigo}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Should report alumno not found", function () {
          expect(body.status).to.equal(404);
          expect(body.errors).to.have.property("codigo");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
