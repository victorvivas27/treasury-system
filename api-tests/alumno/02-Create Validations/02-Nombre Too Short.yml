info:
  name: 02-Nombre Too Short
  type: http
  seq: 2

http:
  method: POST
  url: "{{Url_Base}}/alumnos"
  body:
    type: json
    data: |-
      {
        "nombre": "J",
        "curso": "4A"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Error message should indicate minimum 2 characters", function () {
          expect(body.errors.nombre).to.match(/al menos 2 caracteres/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
