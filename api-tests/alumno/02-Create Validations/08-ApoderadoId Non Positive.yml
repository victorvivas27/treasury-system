info:
  name: 08-ApoderadoId Non Positive
  type: http
  seq: 8

http:
  method: POST
  url: "{{Url_Base}}/alumnos"
  body:
    type: json
    data: |-
      {
        "nombre": "Juan Perez",
        "curso": "4A",
        "apoderadoId": 0
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Should reject non positive apoderadoId", function () {
          expect(body.errors.apoderadoId).to.match(/positivo/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

