info:
  name: 01-List All Alumnos
  type: http
  seq: 1
  tags:
    - alumno

http:
  method: GET
  url: "{{Url_Base}}/alumnos"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response should contain paginated content", function () {
          expect(body.content).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
