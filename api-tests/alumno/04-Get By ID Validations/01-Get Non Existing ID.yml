info:
  name: 01-Get Non Existing ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{Url_Base}}/alumnos/{{alumnoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Should report alumno not found", function () {
          expect(body.code).to.equal("AL-404");
          expect(body.errors).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
