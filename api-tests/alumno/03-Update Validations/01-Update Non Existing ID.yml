info:
  name: 01-Update Non Existing ID
  type: http
  seq: 1
  tags:
    - alumno

http:
  method: PUT
  url: "{{Url_Base}}/alumnos/{{codigo}}"
  body:
    type: json
    data: "{{bodyDataAlumnoUpdate}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Should report alumno not found", function () {
          expect(body.status).to.equal(404);
          expect(body.errors).to.have.property("codigo");
          expect(body.errors.codigo).to.be.a("string");
          expect(body.errors.codigo).to.include("no encontrado");
        });

        test("Should have valid timestamp", function () {
          expect(body.timestamp).to.not.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
