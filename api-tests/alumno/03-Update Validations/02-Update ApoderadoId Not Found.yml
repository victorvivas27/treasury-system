info:
  name: 02-Update ApoderadoId Not Found
  type: http
  seq: 2

http:
  method: PUT
  url: "{{Url_Base}}/alumnos/{{alumnoId}}"
  body:
    type: json
    data: |-
      {
        "nombre": "Juan Perez",
        "curso": "4A",
        "apoderadoId": 999999
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Should report apoderado not found", function () {
          expect(body.code).to.equal("AL-404-AP");
          expect(body.errors).to.have.property("apoderadoId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

