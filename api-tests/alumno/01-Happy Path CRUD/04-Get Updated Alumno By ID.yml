info:
  name: 04-Get Updated Alumno By ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{Url_Base}}/alumnos/{{alumnoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Should return updated alumno", function () {
          expect(body.nombre).to.equal("JUAN ACTUALIZADO");
          expect(body.curso).to.equal("5B");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

