info:
  name: 00-Create Apoderado For Alumno
  type: http
  seq: 0

http:
  method: POST
  url: "{{Url_Base}}/apoderados"
  body:
    type: json
    data: |-
      {
        "nombre": "APODERADO ALUMNO",
        "email": "apoderado.alumno{{$timestamp}}@example.com",
        "telefono": "987654321",
        "observaciones": "Creado para pruebas de alumno"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response should contain apoderado id", function () {
          expect(body.id).to.not.be.undefined;
        });

        bru.setEnvVar("alumnoApoderadoId", body.id.toString(), { persist: true });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

