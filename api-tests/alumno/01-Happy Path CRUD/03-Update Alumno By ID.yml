info:
  name: 03-Update Alumno By ID
  type: http
  seq: 3
  tags:
    - alumno

http:
  method: PUT
  url: "{{Url_Base}}/alumnos/{{codigo}}"
  body:
    type: json
    data: "{{bodyDataAlumnoUpdate}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Alumno should be updated", function () {
          expect(body.alumnoId).to.equal(Number(bru.getEnvVar("alumnoId")));
          expect(body.codigo).to.equal(bru.getEnvVar("codigo"));
          expect(body.nombre).to.equal("JUAN ACTUALIZADO");
          expect(body.curso).to.equal("5B");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
