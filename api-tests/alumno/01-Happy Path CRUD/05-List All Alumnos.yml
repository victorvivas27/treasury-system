info:
  name: 05-List All Alumnos
  type: http
  seq: 5
  tags:
    - alumno

http:
  method: GET
  url: "{{Url_Base}}/alumnos"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Response should be paginated", function () {
          expect(body.content).to.be.an("array");
          expect(body.page).to.not.be.undefined;
          expect(body.totalElements).to.not.be.undefined;
          expect(body.totalPages).to.not.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
