info:
  name: 02-Get Alumno By ID
  type: http
  seq: 2
  tags:
    - alumno

http:
  method: GET
  url: "{{Url_Base}}/alumnos/{{codigo}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Should return requested alumno", function () {
          expect(body.alumnoId).to.equal(Number(bru.getEnvVar("alumnoId")));
          expect(body.codigo).to.equal(bru.getEnvVar("codigo"));
          expect(body.nombre).to.equal("JUAN PEREZ");
          expect(body.curso).to.equal("4A");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
