info:
  name: 02-Get Alumno By ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{Url_Base}}/alumnos/{{alumnoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Status should be 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Should return requested alumno", function () {
          expect(body.id).to.equal(Number(bru.getEnvVar("alumnoId")));
          expect(body.nombre).to.equal("JUAN PEREZ");
          expect(body.curso).to.equal("4A");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

