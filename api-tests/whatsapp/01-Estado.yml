info:
  name: Consultar ultima invitacion WhatsApp
  type: http
  seq: 1
http:
  method: GET
  url: "{{Url_Base}}/apoderados/{{Guardian_Code}}/invitacion-whatsapp"
runtime:
  scripts:
    - type: tests
      code: |-
        test('Estado accesible sin revelar token', () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).not.to.have.property('token');
          expect(res.getBody()).not.to.have.property('tokenHash');
        });
