info:
  name: Invitar por WhatsApp SOLO con autorizacion de prueba
  type: http
  seq: 2
http:
  method: POST
  url: "{{Url_Base}}/apoderados/{{Guardian_Code}}/invitacion-whatsapp"
  body:
    type: json
    data: |-
      {"authorized":true,"source":"{{WhatsApp_Consent_Source}}","authorizedAt":"{{WhatsApp_Consent_At}}"}
runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvVar('WhatsApp_Test_Send_Allowed') !== 'true') {
          throw new Error('Envio bloqueado. Requiere autorizacion explicita del administrador y destinatario de prueba.');
        }
    - type: tests
      code: |-
        test('Aceptacion no equivale a entrega', () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().deliveryStatus).to.be.oneOf(['ACCEPTED', 'SIMULATED', 'FAILED']);
          expect(res.getBody()).not.to.have.property('token');
        });
