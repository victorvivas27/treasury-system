    {
      "@context": "https://schema.org",

      "alternateName": "Tesorería Escolar App",
      "url": "https://tesoreriaescolar.app/",
      "description": "Plataforma para administrar cuotas, ingresos, gastos y actividades del curso con transparencia.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "inLanguage": "es-CL",

      "browserRequirements": "Requiere JavaScript"
    }
  </script>
  <meta name="app-critical-styles" />
  <link rel="stylesheet" href="/src/shared/style/global.css" />
  <script>
    (() => {
      const read = key => { try { return localStorage.getItem(key); } catch { return null; } };
      const saved = read("app-theme");
      const preference = ["dark", "light", "system"].includes(saved) ? saved : "dark";
      const theme = preference === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      document.documentElement.dataset.theme = theme;
      // Vite derives this allowlist from theme.css, including critical first-paint styles.
      const palettes = /* app-palette-ids */ [];
      const savedPalette = read("app-palette");
      document.documentElement.dataset.palette = palettes.includes(savedPalette) ? savedPalette : "original";
      const fontFamilies = ["default", "jetbrains-mono", "space-mono", "ibm-plex-mono"];
      const savedFontFamily = read("app-font-family");
      document.documentElement.dataset.fontFamily = fontFamilies.includes(savedFontFamily) ? savedFontFamily : "default";
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).backgroundColor;
    })();
  </script>
