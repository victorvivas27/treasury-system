  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Tesorería Escolar",
      "alternateName": "Tesorería Escolar App",

      "operatingSystem": "Any",

      "browserRequirements": "Requiere JavaScript"

  <style>
    html,body,#root{min-width:100%;min-height:100%;margin:0;background:#0a0f1a;color:#f8fafc}
    html{background-color:#0a0f1a;color-scheme:dark}
    html[data-theme="light"],html[data-theme="light"] body,html[data-theme="light"] #root{background:#eef1f4;color:#172033}
    html[data-theme="light"]{color-scheme:light}
  </style>
  <script>
    (() => {
      const saved = localStorage.getItem("app-theme");
      const preference = ["dark", "light", "system"].includes(saved) ? saved : "dark";
      const theme = preference === "system"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#EEF1F4" : "#0A0F1A";
      document.documentElement.dataset.bootStartedAt = String(performance.now());
    })();
  </script>
  <style>
    body{min-height:100vh;min-height:100dvh}
    #root{min-height:100vh;min-height:100dvh}
    #app-boot-loader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;background:#0a0f1a;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .38s ease,visibility .38s ease}
    [data-theme="light"] #app-boot-loader{background:#eef1f4;color:#172033}
    #app-boot-loader::before{content:"";position:absolute;width:min(72vw,520px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.2),rgba(14,165,233,.07) 42%,transparent 70%);filter:blur(8px);animation:boot-breathe 2.4s ease-in-out infinite}
    .boot-loader__content{position:relative;display:grid;justify-items:center;gap:18px;padding:32px;text-align:center}
    .boot-loader__mark{position:relative;display:grid;width:106px;height:106px;place-items:center}
    .boot-loader__ring{position:absolute;inset:0;border:2px solid rgba(56,189,248,.16);border-top-color:#38bdf8;border-right-color:#2563eb;border-radius:50%;animation:boot-spin 1.15s cubic-bezier(.55,.15,.45,.85) infinite}
    .boot-loader__ring::after{content:"";position:absolute;inset:8px;border:1px solid rgba(96,165,250,.18);border-bottom-color:#60a5fa;border-radius:50%;animation:boot-spin 1.8s linear infinite reverse}
    .boot-loader__logo{width:68px;height:68px;border-radius:20px;object-fit:cover;filter:drop-shadow(0 10px 24px rgba(37,99,235,.32))}
    .boot-loader__title{margin:0;font-size:clamp(1.15rem,4vw,1.42rem);font-weight:750;letter-spacing:-.025em}
    .boot-loader__status{display:flex;align-items:center;gap:9px;margin:0;color:#94a3b8;font-size:.82rem;font-weight:550;letter-spacing:.02em}
    [data-theme="light"] .boot-loader__status{color:#64748b}
    .boot-loader__dots{display:inline-flex;gap:4px}
    .boot-loader__dots i{width:4px;height:4px;border-radius:50%;background:#38bdf8;animation:boot-dot 1.1s ease-in-out infinite}
    .boot-loader__dots i:nth-child(2){animation-delay:.14s}.boot-loader__dots i:nth-child(3){animation-delay:.28s}
    #app-boot-loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
    @keyframes boot-breathe{50%{transform:scale(1.08);opacity:.78}}
    @keyframes boot-dot{0%,70%,100%{transform:translateY(0);opacity:.35}35%{transform:translateY(-4px);opacity:1}}
    @media (prefers-reduced-motion:reduce){#app-boot-loader::before,.boot-loader__ring,.boot-loader__ring::after,.boot-loader__dots i{animation:none}#app-boot-loader{transition-duration:.12s}}
  </style>
</head>

<body>
  <div id="app-boot-loader" role="status" aria-live="polite" aria-label="Cargando Tesorería Escolar">
    <div class="boot-loader__content">
      <div class="boot-loader__mark" aria-hidden="true">
        <span class="boot-loader__ring"></span>
        <img class="boot-loader__logo" src="/icono-tesoreria-loader.png" alt="" width="68" height="68"
          decoding="sync" fetchpriority="high" />
      </div>
      <div>
        <p class="boot-loader__title">Tesorería Escolar</p>
        <p class="boot-loader__status">Preparando tu espacio <span class="boot-loader__dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
