log_format account_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;

  # Do not put legacy query tokens in nginx access logs. Fragments never reach HTTP.
  # Cloud Run / upstream access logs need a separate redaction/retention review.
  access_log /dev/stdout account_safe;

  location ~* ^/(restablecer-password|aceptar-invitacion|verificar-correo)/*$ {
    include /etc/nginx/security-headers.conf;
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /avatars/ {
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /email/ {
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
