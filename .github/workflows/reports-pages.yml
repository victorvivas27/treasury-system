name: Publish Coverage Reports

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/pages/**"
      - ".github/workflows/reports-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-pages
  cancel-in-progress: true

jobs:
  build-reports:
    name: Test and assemble HTML reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Generate backend coverage report
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate frontend coverage report
        working-directory: frontend
        run: pnpm test:coverage

      - name: Assemble Pages site
        run: |
          mkdir -p public/backend public/frontend
          cp -R backend/build/reports/jacoco/test/html/. public/backend/
          cp -R frontend/coverage/. public/frontend/
          cp .github/pages/index.html public/index.html
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy reports to GitHub Pages
    needs: build-reports
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
