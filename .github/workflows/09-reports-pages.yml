name: 09-Publish Coverage Reports

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref, tag or SHA to publish reports for"
        required: false
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  validation:
    name: Validate pinned release and coverage
    uses: ./.github/workflows/12-release-validation.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.release_ref || 'main' }}

  build-reports:
    needs: validation
    name: Assemble already validated HTML reports
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.sha }}
          persist-credentials: false

      - name: Download validated frontend coverage
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validation.outputs.frontend_artifact }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: evidence/frontend

      - name: Download validated backend coverage
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validation.outputs.backend_artifact }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: evidence/backend

      - name: Assemble Pages site
        run: |
          node scripts/assemble-public-coverage.mjs evidence public
          mkdir -p public/backend public/frontend
          test -f public/backend/index.html
          test -f public/frontend/index.html
          cp .github/pages/index.html public/index.html
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy reports to GitHub Pages
    needs: build-reports
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
