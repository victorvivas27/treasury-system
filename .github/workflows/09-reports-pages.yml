name: 09-Publish Coverage Reports

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref, tag or SHA to publish reports for"
        required: false
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  build-reports:
    name: Assemble already validated HTML reports
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_ref || 'main' }}
          persist-credentials: false

      - name: Find coverage matching the release inputs
        id: reports
        uses: actions/github-script@v8
        with:
          script: |
            const { currentFingerprint, findArtifact } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci-validation.cjs`);
            for (const suite of ['frontend', 'backend']) {
              const key = currentFingerprint(suite);
              let artifact;
              // The PR result can turn green just before its workflow is marked
              // completed. Allow that short finalization window without retesting.
              for (let attempt = 0; attempt < 6; attempt += 1) {
                artifact = await findArtifact({ github, context, suite, key });
                if (artifact) break;
                if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
              }
              if (!artifact) throw new Error(`No successful ${suite} coverage matches this release. Run its CI workflow on the release ref to generate it; reports never rerun tests implicitly.`);
              core.setOutput(`${suite}_artifact`, artifact.id);
              core.setOutput(`${suite}_run`, artifact.workflow_run.id);
            }

      - name: Download validated frontend coverage
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.reports.outputs.frontend_artifact }}
          run-id: ${{ steps.reports.outputs.frontend_run }}
          github-token: ${{ github.token }}
          path: public/frontend

      - name: Download validated backend coverage
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.reports.outputs.backend_artifact }}
          run-id: ${{ steps.reports.outputs.backend_run }}
          github-token: ${{ github.token }}
          path: public/backend

      - name: Assemble Pages site
        run: |
          mkdir -p public/backend public/frontend
          test -f public/backend/index.html
          test -f public/frontend/index.html
          cp .github/pages/index.html public/index.html
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy reports to GitHub Pages
    needs: build-reports
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
