name: 03-Backend CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional commit, tag or branch to validate
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "scripts/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/03-backend-ci.yml"
permissions:
  contents: read
  actions: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar, testear y verificar cobertura
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Reuse successful validation for identical inputs
        id: validation
        uses: ./.github/actions/reuse-validation
        with:
          suite: backend

      - name: Configurar JDK 17
        if: steps.validation.outputs.reused != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos a gradlew
        if: steps.validation.outputs.reused != 'true'
        run: chmod +x ./gradlew

      - name: Install existing Allure CLI dependencies
        if: steps.validation.outputs.reused != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          run_install: false

      - name: Setup Node for Allure
        if: steps.validation.outputs.reused != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked reporting dependencies
        if: steps.validation.outputs.reused != 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Ejecutar tests y generar cobertura
        id: tests
        if: steps.validation.outputs.reused != 'true'
        env:
          INPUT_FINGERPRINT: ${{ steps.validation.outputs.key }}
        run: node ../scripts/allure-ci.mjs backend

      - name: Subir reporte de cobertura como artefacto
        if: always() && steps.tests.outcome != 'skipped' && steps.validation.outputs.reused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-validation-${{ steps.validation.outputs.key }}
          path: backend/build/allure/ci-evidence
          if-no-files-found: error
          retention-days: ${{ github.retention_days > 14 && 14 || github.retention_days }}
