name: 03-Backend CI

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/03-backend-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/03-backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar, testear y verificar cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar proyecto
        run: ./gradlew clean compileJava

      - name: Ejecutar tests y generar cobertura
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-report-${{ github.run_id }}
          path: backend/build/reports/jacoco/test/html
          if-no-files-found: error
          retention-days: 1
