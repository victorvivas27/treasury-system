name: 03-Backend CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional commit, tag or branch to validate
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/03-backend-ci.yml"
permissions:
  contents: read
  actions: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar, testear y verificar cobertura
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Reuse successful validation for identical inputs
        id: validation
        uses: ./.github/actions/reuse-validation
        with:
          suite: backend

      - name: Configurar JDK 17
        if: steps.validation.outputs.reused != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos a gradlew
        if: steps.validation.outputs.reused != 'true'
        run: chmod +x ./gradlew

      - name: Ejecutar tests y generar cobertura
        if: steps.validation.outputs.reused != 'true'
        run: ./gradlew check jacocoTestReport jacocoTestCoverageVerification

      - name: Subir reporte de cobertura como artefacto
        if: steps.validation.outputs.reused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-validation-${{ steps.validation.outputs.key }}
          path: backend/build/reports/jacoco/test/html
          if-no-files-found: error
          retention-days: ${{ github.retention_days > 14 && 14 || github.retention_days }}
