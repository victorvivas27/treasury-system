name: Bruno API Tests (Cached)

on:
  push:
    branches: [dev, main, master]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SERVER_PORT: 5055

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Start backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERVER_PORT: 5055
        run: |
          cd backend
          chmod +x gradlew

          ./gradlew bootRun > backend.log 2>&1 &

          echo "⏳ Esperando backend..."

          timeout 120 bash -c '
            until curl -s http://localhost:5055/actuator/health > /dev/null
            do
              sleep 5
            done
          '

          echo "✅ Backend iniciado"

      - name: Prepare Bruno environment
        run: |
          mkdir -p api-tests/environments

          cat > api-tests/environments/local.yml <<EOF
          vars:
            Url_Base: http://localhost:5055/tesoreria/api/v1
          EOF

      - name: Run Bruno tests
        run: |
          cd api-tests
          pnpm dlx @usebruno/cli run "./apoderado" --env local

      - name: Show backend logs
        if: failure()
        run: |
          cat backend/backend.log || true

      - name: Stop backend
        if: always()
        run: |
          pkill -f "java" || true
