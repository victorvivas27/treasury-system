name: Secret scanning

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan commits with fully redacted findings
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Use built-in rules, not a configuration supplied by the PR.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          log_opts='--all'
          if [[ "$EVENT_NAME" != 'schedule' && "$EVENT_NAME" != 'workflow_dispatch' && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git rev-parse --verify --end-of-options "${BASE_SHA}^{commit}" > /dev/null
            git rev-parse --verify --end-of-options "${HEAD_SHA}^{commit}" > /dev/null
            log_opts="${BASE_SHA}..${HEAD_SHA}"
          fi
          gitleaks git . --redact=100 --no-banner --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignores" \
            --log-opts="$log_opts"
