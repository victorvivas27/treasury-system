name: 02-Frontend CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional commit, tag or branch to validate
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - ".github/workflows/02-frontend-ci.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-frontend:
    name: Lint, Test, Build and Coverage
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Reuse successful validation for identical inputs
        id: validation
        uses: ./.github/actions/reuse-validation
        with:
          suite: frontend

      # pnpm debe instalarse antes de configurar el caché de setup-node.
      - name: Install pnpm
        if: steps.validation.outputs.reused != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          run_install: false

      - name: Setup Node.js
        if: steps.validation.outputs.reused != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Show versions
        if: steps.validation.outputs.reused != 'true'
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        if: steps.validation.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.validation.outputs.reused != 'true'
        run: pnpm run lint

      - name: Run tests with coverage
        if: steps.validation.outputs.reused != 'true'
        run: pnpm run test:coverage

      - name: Build
        if: steps.validation.outputs.reused != 'true'
        run: pnpm run build

      - name: Upload coverage report
        if: steps.validation.outputs.reused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-validation-${{ steps.validation.outputs.key }}
          path: frontend/coverage/combined
          if-no-files-found: error
          retention-days: 14
