name: 04-Bruno API Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional commit, tag or branch to validate
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      force:
        type: boolean
        default: false
    outputs:
      artifact:
        description: Fresh Bruno coverage and Allure evidence
        value: ${{ jobs.api-tests.outputs.artifact }}
      key:
        description: Bruno input fingerprint
        value: ${{ jobs.api-tests.outputs.key }}
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "api-tests/**"
      - ".github/workflows/04-bruno-tests.yml"
      - "scripts/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
permissions:
  contents: read
  actions: read

concurrency:
  group: bruno-api-tests-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Run Bruno API suite
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.coverage.outputs.artifact-id }}
      key: ${{ steps.validation.outputs.key }}

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: treasury_ci
      DB_USER: treasury_ci
      DB_PASSWORD: treasury_ci
      PORT: 5055
      BRUNO_SEED_DATABASE: 'true'
      BRUNO_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/treasury_ci
      BRUNO_TEST_DB_USER: treasury_ci
      BRUNO_TEST_DB_PASSWORD: treasury_ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: treasury_ci
          POSTGRES_USER: treasury_ci
          POSTGRES_PASSWORD: treasury_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasury_ci -d treasury_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Reuse successful validation for identical inputs
        id: validation
        uses: ./.github/actions/reuse-validation
        with:
          suite: bruno
          force: ${{ inputs.force && 'true' || 'false' }}

      - name: Setup JDK 17
        if: steps.validation.outputs.reused != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup pnpm
        if: steps.validation.outputs.reused != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.validation.outputs.reused != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build backend
        if: steps.validation.outputs.reused != 'true'
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bootJar prepareBrunoAgent

      - name: Install existing Allure dependencies
        if: steps.validation.outputs.reused != 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify coverage and publication tooling
        if: steps.validation.outputs.reused != 'true'
        run: node --test scripts/bruno-auth.test.mjs scripts/bruno-coverage.test.mjs scripts/bruno-fixture.test.mjs scripts/bruno-report.integration.test.mjs scripts/allure-coverage.test.mjs scripts/assemble-allure.test.mjs

      - name: Start backend
        if: steps.validation.outputs.reused != 'true'
        working-directory: backend
        run: |
          java -javaagent:build/bruno/jacocoagent.jar=output=tcpserver,address=127.0.0.1,port=6300,dumponexit=false,includes=com.tesoreria.* -jar build/libs/*.jar > backend.log 2>&1 &
          backend_pid=$!
          echo "$backend_pid" > backend.pid

          echo "Esperando backend..."
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "::error::El proceso del backend terminó durante el arranque."
              exit 1
            fi

            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 5 \
              http://localhost:5055/tesoreria/api/v1/auth/me) || status=000
            # El endpoint requiere autenticación: 401 confirma que Security responde.
            if [[ "$status" == "200" || "$status" == "401" ]]; then
              echo "Backend iniciado"
              exit 0
            fi
            sleep 2
          done

          echo "::error::El backend no estuvo disponible en 120 segundos (HTTP $status)."
          exit 1

      - name: Run Bruno tests
        if: steps.validation.outputs.reused != 'true'
        env:
          INPUT_FINGERPRINT: ${{ steps.validation.outputs.key }}
        run: node scripts/run-bruno-allure.mjs

      - name: Upload Bruno coverage and private Allure evidence
        id: coverage
        if: steps.validation.outputs.reused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bruno-coverage-${{ steps.validation.outputs.key }}
          path: backend/build/bruno/ci-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Show backend logs
        if: failure() && steps.validation.outputs.reused != 'true'
        run: cat backend/backend.log || true

      - name: Stop backend
        if: always() && steps.validation.outputs.reused != 'true'
        run: |
          if [[ -f backend/backend.pid ]]; then
            kill "$(cat backend/backend.pid)" 2>/dev/null || true
          fi

      - name: Record successful validation
        if: steps.validation.outputs.reused != 'true'
        env:
          VALIDATION_KEY: ${{ steps.validation.outputs.key }}
        run: printf '%s\n' "$VALIDATION_KEY" > validation-receipt.txt
      - name: Upload validation receipt
        if: steps.validation.outputs.reused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bruno-validation-${{ steps.validation.outputs.key }}
          path: validation-receipt.txt
          if-no-files-found: error
          retention-days: ${{ github.retention_days > 14 && 14 || github.retention_days }}
