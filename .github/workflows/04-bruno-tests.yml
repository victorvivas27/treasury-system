name: 04-Bruno API Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "api-tests/**"
      - ".github/workflows/04-bruno-tests.yml"
permissions:
  contents: read

concurrency:
  group: bruno-api-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Run Bruno API suite
    runs-on: ubuntu-24.04

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: treasury_ci
      DB_USER: treasury_ci
      DB_PASSWORD: treasury_ci
      PORT: 5055

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: treasury_ci
          POSTGRES_USER: treasury_ci
          POSTGRES_PASSWORD: treasury_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasury_ci -d treasury_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build backend
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bootJar

      - name: Start backend
        working-directory: backend
        run: |
          java -jar build/libs/*.jar > backend.log 2>&1 &
          backend_pid=$!
          echo "$backend_pid" > backend.pid

          echo "Esperando backend..."
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "::error::El proceso del backend terminó durante el arranque."
              exit 1
            fi

            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 5 \
              http://localhost:5055/tesoreria/api/v1/auth/me) || status=000
            # El endpoint requiere autenticación: 401 confirma que Security responde.
            if [[ "$status" == "200" || "$status" == "401" ]]; then
              echo "Backend iniciado"
              exit 0
            fi
            sleep 2
          done

          echo "::error::El backend no estuvo disponible en 120 segundos (HTTP $status)."
          exit 1

      - name: Prepare Bruno environment
        run: |
          mkdir -p api-tests/environments
          cat > api-tests/environments/local.yml <<EOF
          vars:
            Url_Base: http://localhost:5055/tesoreria/api/v1
          EOF

      - name: Run Bruno tests
        working-directory: api-tests
        run: pnpm dlx @usebruno/cli run "./apoderado" --env local

      - name: Show backend logs
        if: failure()
        run: cat backend/backend.log || true

      - name: Stop backend
        if: always()
        run: |
          if [[ -f backend/backend.pid ]]; then
            kill "$(cat backend/backend.pid)" 2>/dev/null || true
          fi
