name: 04-Bruno API Tests

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "api-tests/**"
      - ".github/workflows/04-bruno-tests.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "api-tests/**"
      - ".github/workflows/04-bruno-tests.yml"

permissions:
  contents: read

concurrency:
  group: bruno-api-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Run Bruno API suite
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: treasury_ci
      DB_USER: treasury_ci
      DB_PASSWORD: treasury_ci
      PORT: 5055

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: treasury_ci
          POSTGRES_USER: treasury_ci
          POSTGRES_PASSWORD: treasury_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasury_ci -d treasury_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start backend
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew bootRun > backend.log 2>&1 &

          echo "Esperando backend..."
          timeout 120 bash -c '
            until curl -s http://localhost:5055/tesoreria/api/v1/auth/me > /dev/null
            do
              sleep 5
            done
          '
          echo "Backend iniciado"

      - name: Prepare Bruno environment
        run: |
          mkdir -p api-tests/environments
          cat > api-tests/environments/local.yml <<EOF
          vars:
            Url_Base: http://localhost:5055/tesoreria/api/v1
          EOF

      - name: Run Bruno tests
        working-directory: api-tests
        run: pnpm dlx @usebruno/cli run "./apoderado" --env local

      - name: Show backend logs
        if: failure()
        run: cat backend/backend.log || true

      - name: Stop backend
        if: always()
        run: pkill -f "java" || true
