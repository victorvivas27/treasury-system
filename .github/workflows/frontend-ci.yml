name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'

jobs:
  validate-frontend:
    name: Lint, Test, Build and Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CORRECCIÓN 1: Primero se instala pnpm en el sistema (Actualizado a v4)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Se recomienda v9 para Node 22, cámbialo a 8 solo si tu pnpm-lock es v8

      # CORRECCIÓN 2: Segundo se levanta Node.js y se asocia al caché del pnpm ya instalado
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show versions
        run: |
          node -v
          pnpm -v

      - name: Lint
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
