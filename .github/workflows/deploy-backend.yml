name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, publish and deploy backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ secrets.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Build backend image
        working-directory: backend
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.BACKEND_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            --tag "$IMAGE_URI" \
            .

      - name: Publish backend image
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.BACKEND_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker push "$IMAGE_URI"

      - name: Deploy backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ secrets.GCP_REGION }}
          service: ${{ secrets.CLOUD_RUN_BACKEND_SERVICE }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.BACKEND_IMAGE_NAME }}:${{ github.sha }}

          flags: >-
            --service-account=${{ secrets.RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated
            --port=8080

          env_vars_update_strategy: overwrite

          env_vars: |-
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            APP_PROFILE=${{ secrets.APP_PROFILE }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION_MS=1800000
            REFRESH_TOKEN_EXPIRATION_SECONDS=2592000
            REFRESH_COOKIE_SECURE=true
            REFRESH_COOKIE_SAME_SITE=${{ secrets.REFRESH_COOKIE_SAME_SITE }}
            APP_CORS_ALLOWED_ORIGINS=${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
            EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            WEB_PUSH_ENABLED=true
            WEB_PUSH_PUBLIC_KEY=${{ secrets.WEB_PUSH_PUBLIC_KEY }}
            WEB_PUSH_PRIVATE_KEY=${{ secrets.WEB_PUSH_PRIVATE_KEY }}
            WEB_PUSH_SUBJECT=${{ secrets.WEB_PUSH_SUBJECT }}
            GCS_ENABLED=true
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
            GCS_MAX_FILE_SIZE_MB=10

      - name: Show deployed backend URL
        run: |
          echo "Backend desplegado en:"
          echo "${{ steps.deploy.outputs.url }}"
