name: 08-Deploy Frontend to Cloud Run

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref, tag or SHA to deploy"
        required: false
        default: main

  workflow_call:
    inputs:
      release_ref:
        type: string
        default: main
      validated_sha:
        type: string
        default: ''
      frontend_artifact:
        type: string
        default: ''
      backend_artifact:
        type: string
        default: ''
      frontend_key:
        type: string
        default: ''
      backend_key:
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  validation:
    name: Validate pinned release and coverage
    uses: ./.github/workflows/12-release-validation.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.release_ref || 'main' }}
      validated_sha: ${{ inputs.validated_sha || '' }}
      frontend_artifact: ${{ inputs.frontend_artifact || '' }}
      backend_artifact: ${{ inputs.backend_artifact || '' }}
      frontend_key: ${{ inputs.frontend_key || '' }}
      backend_key: ${{ inputs.backend_key || '' }}

  build-and-deploy:
    needs: validation
    name: Build, publish and deploy frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build frontend image
        working-directory: frontend
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/treasury-frontend:${{ needs.validation.outputs.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            --build-arg VITE_SITE_URL="${{ secrets.VITE_SITE_URL }}" \
            --tag "$IMAGE_URI" \
            .

      - name: Publish frontend image
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/treasury-frontend:${{ needs.validation.outputs.sha }}
        run: docker push "$IMAGE_URI"

      - name: Deploy frontend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ secrets.GCP_REGION }}
          service: ${{ secrets.CLOUD_RUN_FRONTEND_SERVICE }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/treasury-frontend:${{ needs.validation.outputs.sha }}
          flags: >-
            --service-account=${{ secrets.RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated
            --port=8080

      - name: Show deployed frontend URL
        run: echo "${{ steps.deploy.outputs.url }}"
