name: 11-Publish Private Allure Reports

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref with successful matching frontend and backend CI evidence
        required: true
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: private-allure-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: quality-reports
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Locate already validated reports
        id: reports
        uses: actions/github-script@v8
        with:
          script: |
            const { currentFingerprint, findArtifact } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci-validation.cjs`);
            for (const suite of ['frontend', 'backend']) {
              const key = currentFingerprint(suite);
              const artifact = await findArtifact({ github, context, suite, key });
              if (!artifact) throw new Error(`Missing ${suite} CI evidence. Run its CI on the selected ref; publication never reruns tests.`);
              const { data: source } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: artifact.workflow_run.id });
              core.setOutput(`${suite}_artifact`, artifact.id);
              core.setOutput(`${suite}_run`, source.id);
              core.setOutput(`${suite}_sha`, source.head_sha);
              core.setOutput(`${suite}_key`, key);
            }

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.reports.outputs.frontend_artifact }}
          run-id: ${{ steps.reports.outputs.frontend_run }}
          github-token: ${{ github.token }}
          path: evidence/frontend

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.reports.outputs.backend_artifact }}
          run-id: ${{ steps.reports.outputs.backend_run }}
          github-token: ${{ github.token }}
          path: evidence/backend

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Authenticate private report publisher
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.ALLURE_PUBLISH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify private storage and read history
        env:
          BUCKET: ${{ vars.ALLURE_REPORTS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$ ]]
          test "$(gcloud storage buckets describe "gs://$BUCKET" --format='value(public_access_prevention)')" = enforced
          gcloud storage ls "gs://$BUCKET/allure/v1/catalog.json" > catalog-location.txt 2> catalog-error.txt || {
            if ! grep -q 'matched no objects' catalog-error.txt; then cat catalog-error.txt; exit 1; fi
          }
          if test -s catalog-location.txt; then
            gcloud storage cp "gs://$BUCKET/allure/v1/catalog.json" previous-catalog.json
          fi

      - name: Assemble attributed immutable HTML
        env:
          FRONTEND_KEY: ${{ steps.reports.outputs.frontend_key }}
          BACKEND_KEY: ${{ steps.reports.outputs.backend_key }}
          FRONTEND_SHA: ${{ steps.reports.outputs.frontend_sha }}
          BACKEND_SHA: ${{ steps.reports.outputs.backend_sha }}
          FRONTEND_RUN: ${{ steps.reports.outputs.frontend_run }}
          BACKEND_RUN: ${{ steps.reports.outputs.backend_run }}
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_SHA="$(git rev-parse HEAD)"
          node scripts/assemble-allure.mjs ci evidence/frontend evidence/backend private-reports

      - name: Upload private HTML then update catalog
        env:
          BUCKET: ${{ vars.ALLURE_REPORTS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cp --recursive --no-clobber --cache-control='no-store' private-reports/reports "gs://$BUCKET/allure/v1/"
          gcloud storage cp --cache-control='no-store' private-reports/catalog.json "gs://$BUCKET/allure/v1/catalog.json"
