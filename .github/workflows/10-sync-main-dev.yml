name: 10 - Sync main into dev

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      already_validated:
        description: The exact release candidate already passed all reusable CI suites.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  sync:
    name: Preserve main history in dev
    runs-on: ubuntu-24.04
    concurrency:
      group: sync-main-into-dev
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      requiresValidation: ${{ steps.merge.outputs.requiresValidation }}
    steps:
      - name: Synchronize main into dev without rewriting history
        id: merge
        uses: actions/github-script@v8
        env:
          ALREADY_VALIDATED: ${{ inputs.already_validated }}
        with:
          script: |
            const { data: main } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main',
            });
            const mainSha = main.object.sha;
            const { data: mainInDev } = await github.rest.repos.compareCommits({
              ...context.repo, base: mainSha, head: 'dev',
            });
            if (mainInDev.merge_base_commit.sha === mainSha) {
              const { data: dev } = await github.rest.git.getRef({
                ...context.repo, ref: 'heads/dev',
              });
              core.setOutput('sha', dev.object.sha);
              core.setOutput('requiresValidation', 'false');
              core.info(`dev already includes main ${mainSha}; no update needed`);
              return;
            }

            const { data: dev } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/dev',
            });
            const { data: devInMain } = await github.rest.repos.compareCommits({
              ...context.repo, base: dev.object.sha, head: mainSha,
            });
            let requiresValidation = process.env.ALREADY_VALIDATED !== 'true';
            if (devInMain.merge_base_commit.sha === dev.object.sha) {
              // Move the branch ref only when this is a strict fast-forward.
              // force:false makes a concurrent/non-FF update fail safely.
              await github.rest.git.updateRef({
                ...context.repo, ref: 'heads/dev', sha: mainSha, force: false,
              });
            } else {
              // Preserve both histories; conflicts fail safely without replacing dev.
              await github.rest.repos.merge({
                ...context.repo, base: 'dev', head: mainSha,
                commit_message: 'chore(branches): sync main into dev',
              });
              requiresValidation = true;
            }
            const { data: syncedDev } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/dev',
            });
            const { data: verified } = await github.rest.repos.compareCommits({
              ...context.repo, base: mainSha, head: syncedDev.object.sha,
            });
            if (verified.merge_base_commit.sha !== mainSha) {
              throw new Error('main was not integrated into dev; refusing to report success');
            }
            core.setOutput('sha', syncedDev.object.sha);
            core.setOutput('requiresValidation', String(requiresValidation));
            core.info(`dev includes main ${mainSha}; ${requiresValidation ? 'validating merge' : 'fast-forward already validated'} at ${syncedDev.object.sha}`);

  # GITHUB_TOKEN merges do not trigger push or PR workflows.
  # Run all checks explicitly on the synchronized commit.
  frontend:
    needs: sync
    if: needs.sync.outputs.requiresValidation == 'true'
    uses: ./.github/workflows/02-frontend-ci.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
  backend:
    needs: sync
    if: needs.sync.outputs.requiresValidation == 'true'
    uses: ./.github/workflows/03-backend-ci.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
  versioning:
    needs: sync
    if: needs.sync.outputs.requiresValidation == 'true'
    uses: ./.github/workflows/05-versioning-ci.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
  bruno:
    needs: sync
    if: needs.sync.outputs.requiresValidation == 'true'
    uses: ./.github/workflows/04-bruno-tests.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
