name: 06 - Release Please

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      number: ${{ steps.candidate.outputs.number }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      released: ${{ steps.release.outputs.releases_created }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Select pending release
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:release-please--branches--main`,
            });

            const pr = prs.find(
              (pr) =>
                !pr.draft &&
                pr.head.repo.full_name ===
                  `${context.repo.owner}/${context.repo.repo}` &&
                pr.labels.some(
                  (label) => label.name === 'autorelease: pending'
                )
            );

            if (!pr) {
              core.info('No pending Release Please PR found.');
              return;
            }

            const { data: comparison } =
              await github.rest.repos.compareCommits({
                ...context.repo,
                base: pr.base.sha,
                head: pr.head.sha,
              });

            if (comparison.merge_base_commit.sha !== pr.base.sha) {
              throw new Error(
                'Release branch is behind main; rerun preparation before validation'
              );
            }

            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.sha);

            core.info(`Release PR: #${pr.number}`);
            core.info(`Release SHA: ${pr.head.sha}`);
            core.info(`Base SHA: ${pr.base.sha}`);

  frontend:
    name: Validate frontend
    needs: prepare
    if: needs.prepare.outputs.number != ''

    uses: ./.github/workflows/02-frontend-ci.yml

    with:
      ref: ${{ needs.prepare.outputs.sha }}

  backend:
    name: Validate backend
    needs: prepare
    if: needs.prepare.outputs.number != ''

    uses: ./.github/workflows/03-backend-ci.yml

    with:
      ref: ${{ needs.prepare.outputs.sha }}

  versioning:
    name: Validate versioning
    needs: prepare
    if: needs.prepare.outputs.number != ''

    uses: ./.github/workflows/05-versioning-ci.yml

    with:
      ref: ${{ needs.prepare.outputs.sha }}

  bruno:
    name: Validate API contract
    needs: prepare
    if: needs.prepare.outputs.number != ''

    uses: ./.github/workflows/04-bruno-tests.yml

    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Merge and publish release
    needs:
      - prepare
      - frontend
      - backend
      - versioning
      - bruno

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      released: ${{ steps.publish.outputs.releases_created }}
      tag_name: ${{ steps.release-ref.outputs.tag_name }}

    steps:
      - name: Merge only the validated release commit
        uses: actions/github-script@v7
        env:
          RELEASE_PR: ${{ needs.prepare.outputs.number }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}

        with:
          script: |
            const { data: main } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });

            if (main.object.sha !== process.env.RELEASE_BASE) {
              throw new Error(
                'main changed during validation; retry the release against the new base'
              );
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.RELEASE_PR),
            });

            const isEligible =
              pr.state === 'open' &&
              !pr.draft &&
              pr.base.ref === 'main' &&
              pr.head.ref === 'release-please--branches--main' &&
              pr.head.repo.full_name ===
                `${context.repo.owner}/${context.repo.repo}` &&
              pr.labels.some(
                (label) => label.name === 'autorelease: pending'
              );

            if (!isEligible) {
              throw new Error('Not an eligible Release Please PR');
            }

            const { data: result } = await github.rest.pulls.merge({
              ...context.repo,
              pull_number: pr.number,
              sha: process.env.RELEASE_SHA,
              merge_method: 'squash',
              commit_title: pr.title.trim(),
            });

            if (!result.merged) {
              throw new Error(result.message);
            }

            core.info(`Release PR #${pr.number} merged successfully.`);

      # Merges realizados con GITHUB_TOKEN no disparan nuevos
      # workflows de push. Por eso publicamos explícitamente.
      - name: Publish merged release
        id: publish
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Resolve published release tag
        id: release-ref
        if: steps.publish.outputs.releases_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.tag_name }}
        with:
          script: |
            if (process.env.RELEASE_TAG) {
              core.setOutput('tag_name', process.env.RELEASE_TAG);
              return;
            }

            const { data: release } = await github.rest.repos.getLatestRelease({
              ...context.repo,
            });

            core.setOutput('tag_name', release.tag_name);

  deploy:
    name: Trigger production workflows

    needs:
      - prepare
      - publish

    if: >-
      always() &&
      !cancelled() &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.released == 'true' &&
      needs.publish.outputs.tag_name != ''

    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Trigger deployments and coverage reports
        uses: actions/github-script@v7
        env:
          RELEASE_REF: ${{ needs.publish.outputs.tag_name }}
        with:
          script: |
            const workflows = [
              '07-deploy-backend.yml',
              '08-deploy-frontend.yml',
              '09-reports-pages.yml',
            ];

            for (const workflow_id of workflows) {
              core.info(`Triggering ${workflow_id}`);

              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id,
                ref: 'main',
                inputs: {
                  release_ref: process.env.RELEASE_REF,
                },
              });
            }
