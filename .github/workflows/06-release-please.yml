name: 06 - Release Please

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      number: ${{ steps.candidate.outputs.number }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      released: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create scoped Release Please token
        id: release-please-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-please-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Select pending release
        id: candidate
        uses: actions/github-script@v8
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:release-please--branches--main`,
            });

            const pr = prs.find(
              (pr) =>
                !pr.draft &&
                pr.head.repo.full_name ===
                  `${context.repo.owner}/${context.repo.repo}` &&
                pr.labels.some(
                  (label) => label.name === 'autorelease: pending'
                )
            );

            if (!pr) {
              core.info('No pending Release Please PR found.');
              return;
            }

            const { data: comparison } =
              await github.rest.repos.compareCommits({
                ...context.repo,
                base: pr.base.sha,
                head: pr.head.sha,
              });

            if (comparison.merge_base_commit.sha !== pr.base.sha) {
              throw new Error(
                'Release branch is behind main; rerun preparation before validation'
              );
            }

            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.sha);

            core.info(`Release PR: #${pr.number}`);
            core.info(`Release SHA: ${pr.head.sha}`);
            core.info(`Base SHA: ${pr.base.sha}`);

  publish:
    name: Merge and publish release
    needs: prepare
    if: needs.prepare.outputs.number != ''

    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write
      checks: read

    outputs:
      released: ${{ steps.publish.outputs.releases_created }}
      tag_name: ${{ steps.release-ref.outputs.tag_name }}

    steps:
      - name: Wait for required PR check and merge the validated release
        uses: actions/github-script@v8
        env:
          RELEASE_PR: ${{ needs.prepare.outputs.number }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}

        with:
          script: |
            const pullNumber = Number(process.env.RELEASE_PR);
            const releaseSha = process.env.RELEASE_SHA;
            const releaseBase = process.env.RELEASE_BASE;
            const checkName = 'PR validation result';
            const maxAttempts = 180;
            const pollIntervalMs = 10_000;

            const getCurrentState = async () => {
              const [{ data: main }, { data: pr }] = await Promise.all([
                github.rest.git.getRef({ ...context.repo, ref: 'heads/main' }),
                github.rest.pulls.get({ ...context.repo, pull_number: pullNumber }),
              ]);
              if (main.object.sha !== releaseBase || pr.base.sha !== releaseBase) {
                throw new Error('main changed during validation; retry the release against the new base');
              }
              const eligible = pr.state === 'open' && !pr.draft && pr.base.ref === 'main' &&
                pr.head.ref === 'release-please--branches--main' &&
                pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                pr.labels.some(label => label.name === 'autorelease: pending');
              if (!eligible) throw new Error('Not an eligible Release Please PR');
              if (pr.head.sha !== releaseSha) {
                throw new Error('Release PR head changed during validation; refusing to merge an unvalidated SHA');
              }
              return pr;
            };

            const matchingCheck = async mergeSha => {
              if (!mergeSha) return null;
              const { data } = await github.rest.checks.listForRef({
                ...context.repo,
                ref: mergeSha,
                check_name: checkName,
                filter: 'latest',
                per_page: 100,
              });
              const matchingRuns = data.check_runs.filter(run => run.name === checkName &&
                run.pull_requests?.some(link => link.number === pullNumber &&
                  link.head?.sha === releaseSha && link.base?.sha === releaseBase));
              return matchingRuns.reduce((latest, run) => !latest || run.id > latest.id ? run : latest, null);
            };

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const pr = await getCurrentState();
              const candidateMergeSha = pr.merge_commit_sha;
              const check = await matchingCheck(candidateMergeSha);

              if (check?.status === 'completed' && check.conclusion !== 'success') {
                throw new Error(`${checkName} completed with conclusion: ${check.conclusion}`);
              }

              if (check?.status === 'completed' && check.conclusion === 'success') {
                // Re-read every moving reference and the required check immediately before merge.
                const latest = await getCurrentState();
                if (latest.merge_commit_sha !== candidateMergeSha) {
                  core.info('PR merge SHA changed while checking; waiting for validation on the new merge SHA.');
                } else {
                  const latestCheck = await matchingCheck(latest.merge_commit_sha);
                  const currentMain = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
                  const currentPr = await github.rest.pulls.get({ ...context.repo, pull_number: pullNumber });
                  if (currentMain.data.object.sha !== releaseBase ||
                      currentPr.data.base.sha !== releaseBase ||
                      currentPr.data.head.sha !== releaseSha ||
                      currentPr.data.merge_commit_sha !== candidateMergeSha) {
                    throw new Error('Release PR or main changed after validation; refusing to merge');
                  }
                  if (latestCheck?.status === 'completed' && latestCheck.conclusion !== 'success') {
                    throw new Error(`${checkName} completed with conclusion: ${latestCheck.conclusion}`);
                  }
                  if (latestCheck?.status === 'completed' && latestCheck.conclusion === 'success') {
                    const { data: result } = await github.rest.pulls.merge({
                      ...context.repo,
                      pull_number: pullNumber,
                      sha: releaseSha,
                      merge_method: 'merge',
                      commit_title: currentPr.data.title.trim(),
                    });
                    if (!result.merged) throw new Error(result.message);
                    core.info(`Release PR #${pullNumber} merged successfully after ${checkName} passed on ${candidateMergeSha}.`);
                    return;
                  }
                }
              }

              if (attempt === maxAttempts) {
                throw new Error(`${checkName} was absent or still pending after ${maxAttempts * pollIntervalMs / 60_000} minutes`);
              }
              core.info(`${checkName} is absent or pending (attempt ${attempt}/${maxAttempts}); polling again.`);
              await new Promise(resolve => setTimeout(resolve, pollIntervalMs));
            }

      # Merges realizados con GITHUB_TOKEN no disparan nuevos
      # workflows de push. Por eso publicamos explícitamente.
      - name: Publish merged release
        id: publish
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Resolve published release tag
        id: release-ref
        if: steps.publish.outputs.releases_created == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.tag_name }}
        with:
          script: |
            if (process.env.RELEASE_TAG) {
              core.setOutput('tag_name', process.env.RELEASE_TAG);
              return;
            }

            const { data: release } = await github.rest.repos.getLatestRelease({
              ...context.repo,
            });

            core.setOutput('tag_name', release.tag_name);

  release-result:
    name: Resolve release published in either stage
    needs: [prepare, publish]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (needs.prepare.outputs.released == 'true' || needs.publish.outputs.released == 'true')
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.release-ref.outputs.tag_name }}
    steps:
      - name: Resolve exact published tag
        id: release-ref
        uses: actions/github-script@v8
        env:
          PREPARE_RELEASED: ${{ needs.prepare.outputs.released }}
          PREPARE_TAG: ${{ needs.prepare.outputs.tag_name }}
          PUBLISH_RELEASED: ${{ needs.publish.outputs.released }}
          PUBLISH_TAG: ${{ needs.publish.outputs.tag_name }}
        with:
          script: |
            const tag = process.env.PUBLISH_RELEASED === 'true'
              ? process.env.PUBLISH_TAG
              : process.env.PREPARE_RELEASED === 'true' ? process.env.PREPARE_TAG : '';
            if (!tag) throw new Error('A release was published without an exact tag; refusing to dispatch production workflows.');
            core.setOutput('tag_name', tag);

  sync-dev:
    name: Return released main to dev
    needs: release-result
    if: always() && !cancelled() && needs['release-result'].result == 'success'
    uses: ./.github/workflows/10-sync-main-dev.yml
    with:
      already_validated: true
    permissions:
      contents: write
      actions: read

  deploy:
    name: Trigger production workflows

    needs:
      - release-result
    if: always() && !cancelled() && needs['release-result'].result == 'success'

    runs-on: ubuntu-24.04

    permissions:
      actions: write

    steps:
      - name: Trigger deployments and coverage reports
        uses: actions/github-script@v8
        env:
          RELEASE_REF: ${{ needs.release-result.outputs.tag_name }}
        with:
          script: |
            const workflows = [
              '07-deploy-backend.yml',
              '08-deploy-frontend.yml',
              '09-reports-pages.yml',
            ];

            for (const workflow_id of workflows) {
              core.info(`Triggering ${workflow_id}`);

              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id,
                ref: 'main',
                inputs: {
                  release_ref: process.env.RELEASE_REF,
                },
              });
            }
