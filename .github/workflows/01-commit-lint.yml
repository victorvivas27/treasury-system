name: 01-Commit Validation

on:
  workflow_call:
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar commits con commitlint
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: frontend/.commitlintrc.json
          failOnErrors: true

      - name: Validar título del PR
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            chore
            config
            ci
            build
          requireScope: false
