name: 01-Commit Validation

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commit-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-title:
    name: Use latest dev commit as PR title
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Synchronize promotion title
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.ref !== 'dev' ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error('The PR changed during validation; use the newest workflow run.');
            }
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo, ref: pr.head.sha,
            });
            const subject = commit.commit.message.split('\n')[0].trim();
            const conventional = /^(feat|fix|perf|docs|style|refactor|test|chore|config|ci|build)(\([^)]+\))?!?:\s+\S/.test(subject);
            const title = conventional ? subject : `chore: ${subject}`.slice(0, 150).trimEnd();
            if (pr.title !== title) {
              await github.rest.pulls.update({
                ...context.repo, pull_number: pr.number, title,
              });
              core.info('PR title synchronized with the latest dev commit.');
            }

  validate-commits:
    name: Validar Conventional Commits
    needs: promotion-title
    if: >-
      always() && !cancelled() &&
      (needs.promotion-title.result == 'success' || needs.promotion-title.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar mensajes de los commits por SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/validate-commit-message.cjs --range "$BASE_SHA" "$HEAD_SHA"
          else
            node scripts/validate-commit-message.cjs --commit "$HEAD_SHA"
          fi

      - name: Validar título del PR
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            chore
            config
            ci
            build
          requireScope: false
