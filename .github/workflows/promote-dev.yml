name: Promote dev to main

on:
  workflow_run:
    workflows:
      - Frontend CI
      - Backend CI
      - Bruno API Tests (Cached)
      - Commit Validation
    branches: [dev]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  create-pull-request:
    name: Crear PR de dev a main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verificar que todos los controles de dev aprobaron
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 80); do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=push&per_page=100" \
              --jq '[.workflow_runs[] | {name, status, conclusion}]')"

            echo "Revision ${attempt}/80 de los controles para ${HEAD_SHA}:"
            echo "$runs" | jq .

            if echo "$runs" | jq -e '
              any(.[];
                (.name == "Frontend CI"
                  or .name == "Backend CI"
                  or .name == "Bruno API Tests (Cached)"
                  or .name == "Commit Validation")
                and .status == "completed"
                and .conclusion != "success")
            ' > /dev/null; then
              echo 'Uno o mas controles de dev finalizaron con error.'
              exit 1
            fi

            mandatory_ready=true
            for required in 'Commit Validation' 'Bruno API Tests (Cached)'; do
              if ! echo "$runs" | jq -e --arg name "$required" \
                'any(.[]; .name == $name and .status == "completed" and .conclusion == "success")' \
                > /dev/null; then
                mandatory_ready=false
              fi
            done

            pending="$(echo "$runs" | jq '[
              .[]
              | select(.name == "Frontend CI"
                    or .name == "Backend CI"
                    or .name == "Bruno API Tests (Cached)"
                    or .name == "Commit Validation")
              | select(.status != "completed")
            ] | length')"

            if [ "$mandatory_ready" = true ] && [ "$pending" -eq 0 ]; then
              echo 'Todos los controles de dev aprobaron.'
              break
            fi

            if [ "$attempt" -eq 80 ]; then
              echo 'Los controles no terminaron dentro del tiempo de espera de 20 minutos.'
              exit 1
            fi

            echo 'Hay controles pendientes; se revisaran nuevamente en 15 segundos.'
            sleep 15
          done

      - name: Crear o encontrar el pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing_pr="$(gh pr list \
            --repo "$REPOSITORY" \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Ya existe el PR #${existing_pr} de dev a main."
            echo "number=${existing_pr}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          created_url="$(gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head dev \
            --title 'chore(release): promover dev a main' \
            --body "Todos los controles de CI aprobaron para dev (${HEAD_SHA}). Este PR fue creado automaticamente por GitHub Actions.")"

          created_pr="${created_url##*/}"
          echo "number=${created_pr}" >> "$GITHUB_OUTPUT"

      - name: Fusionar automaticamente el pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          echo "Fusionando automaticamente el PR #${PR_NUMBER} hacia main."
          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --squash
