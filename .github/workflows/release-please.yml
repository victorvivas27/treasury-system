name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      number: ${{ steps.candidate.outputs.number }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select the pending release (including retries)
        uses: actions/github-script@v7
        id: candidate
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo, state: 'open', base: 'main',
              head: `${context.repo.owner}:release-please--branches--main`,
            });
            const pr = prs.find(pr => !pr.draft &&
              pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.labels.some(label => label.name === 'autorelease: pending'));
            if (!pr) return;
            const { data: comparison } = await github.rest.repos.compareCommits({
              ...context.repo, base: pr.base.sha, head: pr.head.sha,
            });
            if (comparison.merge_base_commit.sha !== pr.base.sha) {
              throw new Error('Release branch is behind main; rerun preparation before validation');
            }
            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.sha);

  frontend:
    needs: prepare
    if: needs.prepare.outputs.number != ''
    uses: ./.github/workflows/frontend-ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  backend:
    needs: prepare
    if: needs.prepare.outputs.number != ''
    uses: ./.github/workflows/backend-ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  versioning:
    needs: prepare
    if: needs.prepare.outputs.number != ''
    uses: ./.github/workflows/versioning-ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, frontend, backend, versioning]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Merge only the validated release commit
        uses: actions/github-script@v7
        env:
          RELEASE_PR: ${{ needs.prepare.outputs.number }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}
        with:
          script: |
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (main.object.sha !== process.env.RELEASE_BASE) {
              throw new Error('main changed during validation; retry the release against the new base');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.RELEASE_PR),
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'release-please--branches--main' ||
                pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !pr.labels.some(label => label.name === 'autorelease: pending')) {
              throw new Error('Not an eligible Release Please PR');
            }
            const { data: result } = await github.rest.pulls.merge({
              ...context.repo, pull_number: pr.number,
              sha: process.env.RELEASE_SHA, merge_method: 'squash',
              commit_title: pr.title.trim(),
            });
            if (!result.merged) throw new Error(result.message);
      # GITHUB_TOKEN merges do not trigger a new push workflow: publish explicitly.
      - name: Publish the merged release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  deploy:
    needs: [prepare, publish]
    if: >-
      always() && !cancelled() &&
      (needs.publish.result == 'success' || needs.prepare.outputs.released == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger existing deployments and reports after release
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['deploy-frontend.yml', 'deploy-backend.yml', 'reports-pages.yml']) {
              await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id, ref: 'main' });
            }
