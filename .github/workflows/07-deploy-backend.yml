name: 07-Deploy Backend to Cloud Run

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref, tag or SHA to deploy"
        required: false
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, publish and deploy backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_ref || 'main' }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ secrets.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Verify existing backend service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.CLOUD_RUN_BACKEND_SERVICE }}
        run: |
          gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(metadata.name)' > /dev/null

      - name: Build backend image
        working-directory: backend
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.BACKEND_IMAGE_NAME }}:${{ github.event.inputs.release_ref || github.sha }}
        run: |
          docker build \
            --tag "$IMAGE_URI" \
            .

      - name: Publish backend image
        env:
          IMAGE_URI: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.BACKEND_IMAGE_NAME }}:${{ github.event.inputs.release_ref || github.sha }}
        run: |
          docker push "$IMAGE_URI"

      - name: Deploy backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ secrets.GCP_REGION }}
          service: ${{ secrets.CLOUD_RUN_BACKEND_SERVICE }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.BACKEND_IMAGE_NAME }}:${{ github.event.inputs.release_ref || github.sha }}

          # Image-only release: do not resend stale/empty values from GitHub.
          # Keep runtime configuration, trusted proxies and secret bindings in Cloud Run.
          # ACCOUNT_LINK_USE_FRAGMENT stays false until the compatible frontend is live.
          env_vars_update_strategy: merge
          secrets_update_strategy: merge

      - name: Show deployed backend URL
        run: |
          echo "Backend desplegado en:"
          echo "${{ steps.deploy.outputs.url }}"
