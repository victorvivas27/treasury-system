name: Protected files

on:
  push:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  protected-files:
    name: Reject protected files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check final tree and every introduced commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          node scripts/security/protected-files.cjs --tree HEAD
          node scripts/security/protected-files.cjs --range "${BASE_SHA:-0000000000000000000000000000000000000000}" "$HEAD_SHA"
      - name: Test forced staging and integrity enforcement
        run: node --test scripts/security/security.test.cjs
