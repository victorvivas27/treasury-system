name: 05-Versioning CI

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/**"
      - "scripts/check-version.cjs"
      - "scripts/test-versioning.cjs"
      - "scripts/test-auto-release.cjs"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "VERSION"
      - "CHANGELOG.md"
      - "frontend/package.json"
      - "backend/build.gradle"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check-version.cjs"
      - "scripts/test-versioning.cjs"
      - "scripts/test-auto-release.cjs"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "VERSION"
      - "CHANGELOG.md"
      - "frontend/package.json"
      - "backend/build.gradle"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: versioning-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-versioning:
    name: Validate release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated validation tools
        run: npm install --prefix "$RUNNER_TEMP/release-tools" --no-audit --no-fund --ignore-scripts release-please@17.3.0 ajv@8 yaml@2
      - name: Validate versions, configuration, workflows and release scenarios
        env:
          RELEASE_TOOLS_DIR: ${{ runner.temp }}/release-tools
        run: |
          node scripts/test-versioning.cjs
          node --test scripts/test-auto-release.cjs
